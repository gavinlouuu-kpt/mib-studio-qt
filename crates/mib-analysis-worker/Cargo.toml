[package]
name = "mib-analysis-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
sha2 = "0.10"
cxx = "1"

[build-dependencies]
cxx-build = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
