[package]
name = "mib-bridge-server"
version = "0.1.0"
edition = "2021"
description = "YOFO Studio headless backend server: the shared command layer over a WebSocket for the remote React UI"
license = "MIT"
publish = false

[lib]
name = "mib_bridge_server"
crate-type = ["rlib"]

[[bin]]
name = "yofo-studio-server"
path = "src/main.rs"

[dependencies]
mib-app-commands = { path = "../mib-app-commands" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio-tungstenite = "0.28"
serial_test = "3"
