[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "mib-processing"
version = "0.2.1"
description = "Qt-free deformability-cytometry processing core from mib-studio-qt (pybind11 bindings)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7", "opencv-python-headless>=4.9", "jsonschema>=4"]

[project.urls]
Source = "https://github.com/KPT1020/mib-studio-qt"
Contract = "https://github.com/KPT1020/mib-studio-qt/blob/main/docs/gold_standard_metrics.md"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"

# Drive the repository root CMakeLists.txt (this directory's parent's
# parent) so the extension reuses the same mib_processing target, options,
# and find_package() calls as the desktop build -- see
# ../../cmake/MIBOptions.cmake (MIB_BUILD_PYTHON_BINDINGS) and
# ../../src/backend/CMakeLists.txt (the mib_processing target itself).
cmake.source-dir = "../.."

[tool.scikit-build.cmake.define]
MIB_BUILD_PYTHON_BINDINGS = "ON"
MIB_BUILD_BACKEND_ONLY = "ON"
MIB_BUILD_PROCESSING_ONLY = "ON"
BUILD_TESTING = "OFF"
# Keep the release wheel's CMake graph Qt-free and avoid configuring desktop,
# camera, native-plugin, and sentry targets that are not part of the package.
MIB_USE_SENTRY = "OFF"

[tool.scikit-build.wheel]
packages = ["python/mib_processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
