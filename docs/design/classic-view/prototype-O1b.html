.o1b-review { display: flex; align-items: center; gap: var(--mib-space-2); padding: var(--mib-space-2) var(--mib-space-6);
  background: var(--mib-color-tile); border-bottom: 1px solid var(--mib-color-line); font-size: var(--mib-font-size-sm); color: var(--mib-color-sub); }
.o1b-review__hint { margin-left: var(--mib-space-3); color: var(--mib-color-mute); }
.o1b-main { display: grid; grid-template-columns: 1392px; gap: var(--mib-space-6); padding: 0 var(--mib-space-6) var(--mib-space-6); align-items: start; }
.o1b-col { display: flex; flex-direction: column; gap: var(--mib-space-4); }
.o1b-how { margin: var(--mib-space-1) 18px 0 0; }
.o1b-list .o1b-how .mib-card__body { gap: 6px; }
.o1b-next { display: flex; align-items: center; gap: var(--mib-space-2); font-size: var(--mib-font-size-md); color: var(--mib-color-sub); }
.o1b-refusal { align-self: center; margin-left: var(--mib-space-2); font-size: var(--mib-font-size-md); color: var(--mib-color-sub); }
.ws-note { margin: 0; font-size: var(--mib-font-size-sm); color: var(--mib-color-sub); line-height: 15px; }
.o1b-facts--verdict { grid-template-columns: 146px 1fr; }
.o1b-list .mib-card__body { gap: 0; }
/* Disclosure row (kit gap #715): a native <details>; the summary is title, summary, StateChip. */
.o1b-row { border-top: 1px solid var(--mib-color-line); }
.o1b-row > summary { display: grid; grid-template-columns: 18px 224px minmax(0, 1fr) auto; align-items: center; min-height: 48px;
  list-style: none; cursor: pointer; }
.o1b-row > summary::-webkit-details-marker { display: none; }
.o1b-row > summary[aria-disabled] { cursor: default; }
.o1b-row > summary:focus-visible { outline: 2px solid var(--mib-color-inspect); outline-offset: -2px; }
.o1b-row__chev { font-size: var(--mib-font-size-xs); color: var(--mib-color-sub); }
.o1b-row__title { font-size: var(--mib-font-size-lg); font-weight: var(--mib-font-weight-semibold); color: var(--mib-color-ink); }
.o1b-row__summary { font-size: var(--mib-font-size-md); color: var(--mib-color-sub); padding-right: var(--mib-space-3); }
.o1b-row--quiet .o1b-row__title { font-size: var(--mib-font-size-md); color: var(--mib-color-sub); }
.o1b-row--quiet .o1b-row__summary { color: var(--mib-color-mute); }
.o1b-row__body { display: flex; flex-direction: column; gap: var(--mib-space-2); padding: 0 0 var(--mib-space-4) 18px; }
.o1b-facts { grid-template-columns: 200px minmax(0, 1fr); }
.o1b-facts--gates { grid-template-columns: 156px minmax(0, 1fr); }
.o1b-gates { display: grid; grid-template-columns: 1fr 1fr; gap: var(--mib-space-6); }
.o1b-more { align-self: flex-start; padding: 0; border: 0; background: none; cursor: pointer; text-align: left;
  font-family: var(--mib-font-family); font-size: var(--mib-font-size-md); font-weight: var(--mib-font-weight-semibold); color: var(--mib-color-accent); }
.o1b-actions { display: flex; gap: var(--mib-space-2); margin-top: var(--mib-space-1); }
/* Gate rows as in the workspace (workspace.css .ws-gate / .ws-gate-id / .ws-gate-fix). */
.ws-gate { display: flex; flex-wrap: wrap; align-items: center; gap: var(--mib-space-1) var(--mib-space-2); min-width: 0; }
.ws-gate-id { display: block; font-size: var(--mib-font-size-xs); color: var(--mib-color-mute); }
.ws-gate-fix { flex-basis: 100%; font-size: var(--mib-font-size-sm); color: var(--mib-color-sub); }
.o1b-footer { display: grid; grid-template-columns: 278px repeat(4, 279px); white-space: nowrap; margin-top: auto; padding: var(--mib-space-4) var(--mib-space-6);
  border-top: 1px solid var(--mib-color-line); font-size: var(--mib-font-size-sm); color: var(--mib-color-sub); }
.o1b-footer strong { font-weight: var(--mib-font-weight-semibold); }
</style>
</head><body>
