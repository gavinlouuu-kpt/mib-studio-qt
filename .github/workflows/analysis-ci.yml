name: Analysis core qualification
on:
  pull_request:
    branches: [develop]
    paths:
      - 'include/backend/analysis/**'
      - 'src/backend/analysis/**'
      - 'crates/mib-analysis-worker/**'
      - 'workers/cytoflow/**'
      - 'env/analysis-worker/**'
      - 'tests/analysis/**'
      - 'tools/flowjo_acceptance/**'
      - '.github/workflows/analysis-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native host test dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev nlohmann-json3-dev libspdlog-dev
      - name: Native composition and sanitizers
        run: |
          cmake -S tools/flowjo_acceptance -B build/analysis -DCMAKE_BUILD_TYPE=Debug -DMIB_ANALYSIS_HOST_TESTS=ON \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
          cmake --build build/analysis -j2
          ctest --test-dir build/analysis --output-on-failure
      - name: Supervision, job recovery and protocol checks
        run: |
          cargo fmt --manifest-path crates/mib-analysis-worker/Cargo.toml --check
          cargo clippy --locked --manifest-path crates/mib-analysis-worker/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path crates/mib-analysis-worker/Cargo.toml -- --test-threads=1
      - name: Build pinned real engine (development qualification, not distribution)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/cytoflow/cytoflow.git "$RUNNER_TEMP/cytoflow"
          git -C "$RUNNER_TEMP/cytoflow" checkout 02f40704b24ad8dcd32cee69b9fe50e3aeb56c49
          git -C "$RUNNER_TEMP/cytoflow" submodule update --init fcsparser
          python -m venv "$RUNNER_TEMP/analysis-env"
          "$RUNNER_TEMP/analysis-env/bin/python" -m pip install swig==4.5.1
          # pip's isolated build cannot import the outer venv's Python swig
          # wrapper. Use its packaged native binary + explicit library directory.
          SWIG_DATA=$("$RUNNER_TEMP/analysis-env/bin/python" -c 'import swig; print(swig.DATA)')
          export SWIG_LIB="$SWIG_DATA/share/swig/4.5.1"
          PATH="$SWIG_DATA/bin:$RUNNER_TEMP/analysis-env/bin:$PATH" "$RUNNER_TEMP/analysis-env/bin/python" -m pip install \
            -c env/analysis-worker/runtime-constraints.txt "$RUNNER_TEMP/cytoflow" "$RUNNER_TEMP/cytoflow/fcsparser"
          "$RUNNER_TEMP/analysis-env/bin/python" -c 'from cytoflow.utility.logicle_ext.Logicle import FastLogicle'
      - name: Real Cytoflow, native composition and durable round trip
        run: |
          "$RUNNER_TEMP/analysis-env/bin/python" -m unittest discover -s tests/analysis -p test_worker.py -v
          MIB_CYTOFLOW_PYTHON="$RUNNER_TEMP/analysis-env/bin/python" \
            MIB_CYTOFLOW_WORKER="$GITHUB_WORKSPACE/workers/cytoflow/worker.py" cargo test --locked \
            --manifest-path crates/mib-analysis-worker/Cargo.toml --test worker --test app -- --include-ignored --test-threads=1
