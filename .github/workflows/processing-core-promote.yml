name: Promote or roll back processing core

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing immutable processing-core version to activate
        required: true
        type: string
      channel:
        description: Registry channel whose active pointer should change
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: read

concurrency:
  group: processing-core-registry-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  promote:
    name: Activate ${{ inputs.version }} on ${{ inputs.channel }}
    runs-on: ubuntu-24.04
    environment: Production
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Promote immutable version
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MIB_STUDIO_R2_ENDPOINT: ${{ secrets.MIB_STUDIO_R2_ENDPOINT }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -z "${MIB_STUDIO_R2_ENDPOINT:-}" ]; then
            echo "Promotion requires R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, and MIB_STUDIO_R2_ENDPOINT" >&2
            exit 1
          fi
          python -m pip install --upgrade pip boto3
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/release/publish-processing-core.py \
            --promote-version "$VERSION" \
            --channel "$CHANNEL" \
            --published-at "$published_at" \
            --upload-method s3

      - name: Verify public active pointer and cross-links
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          url="https://updates.yofo.bio/${CHANNEL}/processing-core/latest.json?promotion=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/release/verify-processing-core-manifest.py --manifest-url "$url"
          python - "$url" "$VERSION" <<'PY'
          import json
          import sys
          from urllib.request import Request, urlopen

          url, expected = sys.argv[1:]
          with urlopen(Request(url, headers={"User-Agent": "MIB-Processing-Promotion/1.0"}), timeout=30) as response:
              manifest = json.load(response)
          resolved = manifest.get("version", manifest.get("wheel", {}).get("version"))
          if resolved != expected:
              raise SystemExit(f"resolved version {resolved!r}, expected {expected!r}")
          print(f"Public active pointer resolved version {resolved}.")
          PY
