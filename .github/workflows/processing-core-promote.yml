name: Promote or roll back processing core

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing immutable processing-core version to activate
        required: true
        type: string
      channel:
        description: Registry channel whose active pointer should change
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      line:
        description: Core line (absdiff-laplacian is beta only until Phase 3 opt-in)
        required: true
        default: subtract-ring
        type: choice
        options:
          - subtract-ring
          - absdiff-laplacian

permissions:
  contents: read

concurrency:
  # subtract-ring keeps the group of python-wheel.yml's release job (both write
  # {channel}/processing-core/index.json); other lines match their own release
  # job's group, e.g. processing-core-registry-beta-absdiff-laplacian.
  group: processing-core-registry-${{ inputs.channel }}${{ inputs.line != 'subtract-ring' && format('-{0}', inputs.line) || '' }}
  cancel-in-progress: false

jobs:
  promote:
    name: Activate ${{ inputs.line }} ${{ inputs.version }} on ${{ inputs.channel }}
    runs-on: ubuntu-24.04
    environment: Production
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Promote immutable version
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MIB_STUDIO_R2_ENDPOINT: ${{ secrets.MIB_STUDIO_R2_ENDPOINT }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          LINE: ${{ inputs.line }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -z "${MIB_STUDIO_R2_ENDPOINT:-}" ]; then
            echo "Promotion requires R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, and MIB_STUDIO_R2_ENDPOINT" >&2
            exit 1
          fi
          python -m pip install --upgrade pip boto3
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$LINE" = "subtract-ring" ]; then
            python scripts/release/publish-processing-core.py \
              --promote-version "$VERSION" \
              --channel "$CHANNEL" \
              --published-at "$published_at" \
              --upload-method s3
          else
            # Native-only line subtree; the publisher refuses stable for beta-only lines.
            python scripts/release/publish-processing-core-line.py \
              --line "$LINE" \
              --channel "$CHANNEL" \
              --promote-version "$VERSION" \
              --published-at "$published_at" \
              --endpoint "$MIB_STUDIO_R2_ENDPOINT" \
              --upload-method s3
          fi

      - name: Verify public active pointer and cross-links
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          LINE: ${{ inputs.line }}
        run: |
          set -euo pipefail
          if [ "$LINE" = "subtract-ring" ]; then
            url="https://updates.yofo.bio/${CHANNEL}/processing-core/latest.json?promotion=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            python scripts/release/verify-processing-core-manifest.py --manifest-url "$url"
          else
            # verify-processing-core-manifest.py is wheel-schema specific; the
            # version check below covers the native-only line manifest.
            url="https://updates.yofo.bio/${CHANNEL}/processing-core/absdiff-laplacian/latest.json?promotion=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          python - "$url" "$VERSION" <<'PY'
          import json
          import sys
          from urllib.request import Request, urlopen

          url, expected = sys.argv[1:]
          with urlopen(Request(url, headers={"User-Agent": "MIB-Processing-Promotion/1.0"}), timeout=30) as response:
              manifest = json.load(response)
          resolved = manifest.get("version", manifest.get("wheel", {}).get("version"))
          if resolved != expected:
              raise SystemExit(f"resolved version {resolved!r}, expected {expected!r}")
          print(f"Public active pointer resolved version {resolved}.")
          PY
