name: Python Wheel (mib_processing)

on:
  push:
    branches: [main, master]
    tags: ['mib-processing-v*']
    paths:
      - 'bindings/python/**'
      - 'src/backend/processing/**'
      - 'src/backend/recording/Hdf5Service.*'
      - 'src/backend/diagnostics/CrashStateMirror.*'
      - 'src/backend/playback/FrameStore.*'
      - 'src/backend/app/Tools.*'
      - 'src/backend/CMakeLists.txt'
      - 'include/backend/processing/**'
      - 'include/backend/recording/**'
      - 'tests/processing/**'
      - 'scripts/compare_metrics.py'
      - 'scripts/run_processing_conformance.py'
      - 'scripts/gold_standard_dataset.json'
      - 'scripts/z_adjustment_50v_reference.json'
      - 'scripts/test_compare_metrics.py'
      - 'scripts/test_run_processing_conformance.py'
      - 'scripts/bump_mib_processing_version.py'
      - 'scripts/test-processing-core-authenticode.ps1'
      - 'publish-processing-core.py'
      - 'publish-profiles.py'
      - 'test_publish_profiles.py'
      - 'test_publish_processing_core.py'
      - 'test_bump_mib_processing_version.py'
      - 'test_contract_version_consistency.py'
      - 'test_processing_core_wheel_architectures.py'
      - 'test_processing_core_signer_release_gate.py'
      - 'test_verify_processing_core_manifest.py'
      - 'verify-processing-core-manifest.py'
      - 'docs/gold_standard_metrics.schema.json'
      - 'cmake/MIBOptions.cmake'
      - 'cmake/MIBLinkHelpers.cmake'
      - '.github/workflows/python-wheel.yml'
      - '.github/workflows/processing-core-promote.yml'
  pull_request:
    paths:
      - 'bindings/python/**'
      - 'src/backend/processing/**'
      - 'src/backend/recording/Hdf5Service.*'
      - 'src/backend/diagnostics/CrashStateMirror.*'
      - 'src/backend/playback/FrameStore.*'
      - 'src/backend/app/Tools.*'
      - 'src/backend/CMakeLists.txt'
      - 'include/backend/processing/**'
      - 'include/backend/recording/**'
      - 'tests/processing/**'
      - 'cmake/MIBOptions.cmake'
      - 'cmake/MIBLinkHelpers.cmake'
      - 'scripts/compare_metrics.py'
      - 'scripts/run_processing_conformance.py'
      - 'scripts/gold_standard_dataset.json'
      - 'scripts/z_adjustment_50v_reference.json'
      - 'scripts/test_compare_metrics.py'
      - 'scripts/test_run_processing_conformance.py'
      - 'scripts/bump_mib_processing_version.py'
      - 'scripts/test-processing-core-authenticode.ps1'
      - 'publish-processing-core.py'
      - 'publish-profiles.py'
      - 'test_publish_profiles.py'
      - 'test_publish_processing_core.py'
      - 'test_bump_mib_processing_version.py'
      - 'test_contract_version_consistency.py'
      - 'test_processing_core_wheel_architectures.py'
      - 'test_processing_core_signer_release_gate.py'
      - 'test_verify_processing_core_manifest.py'
      - 'verify-processing-core-manifest.py'
      - 'docs/gold_standard_metrics.schema.json'
      - '.github/workflows/python-wheel.yml'
      - '.github/workflows/processing-core-promote.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source-version:
    name: Validate source/release identity
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.identity.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require release tag to match the wheel version
        id: identity
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/mib-processing-v') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ.get("RELEASE_TAG", "")
          version = tomllib.loads(
              Path("bindings/python/pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          if tag and tag != f"mib-processing-v{version}":
              raise SystemExit(
                  f"release tag {tag!r} does not match source wheel version {version!r}"
              )
          channel = "stable" if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) else "beta"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"channel={channel}\n")
          print(f"source mib-processing version: {version} ({channel})")
          PY

  build-and-test:
    name: Build + test wheel (${{ matrix.label }})
    needs: validate-source-version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            build_selector: cp310-manylinux_x86_64
            arch: x86_64
            artifact_suffix: py3.10-x86_64
            label: CPython 3.10 / x86_64
            full_test: true
          - python-version: '3.11'
            build_selector: cp311-manylinux_x86_64
            arch: x86_64
            artifact_suffix: py3.11-x86_64
            label: CPython 3.11 / x86_64
            full_test: true
          - python-version: '3.12'
            build_selector: cp312-manylinux_x86_64
            arch: x86_64
            artifact_suffix: py3.12-x86_64
            label: CPython 3.12 / x86_64
            full_test: true
          - python-version: '3.13'
            build_selector: cp313-manylinux_x86_64
            arch: x86_64
            artifact_suffix: py3.13-x86_64
            label: CPython 3.13 / x86_64
            full_test: true
          - python-version: '3.12'
            build_selector: >-
              cp310-manylinux_aarch64 cp311-manylinux_aarch64
              cp312-manylinux_aarch64 cp313-manylinux_aarch64
            arch: aarch64
            artifact_suffix: pyall-aarch64
            label: CPython 3.10-3.13 / aarch64
            full_test: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU for ARM64 wheel build and smoke tests
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build repaired manylinux wheel
        uses: pypa/cibuildwheel@v2.22.0
        with:
          package-dir: bindings/python
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.build_selector }}
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y --setopt=install_weak_deps=False epel-release &&
            dnf install -y --setopt=install_weak_deps=False
            opencv-devel hdf5-devel spdlog-devel
          CIBW_TEST_COMMAND: >-
            python -c "import mib_processing as mp;
            assert mp.CONTRACT_VERSION == 1;
            print(mp.__version__, mp.CONTRACT_VERSION)"

      - name: Set up Python
        if: matrix.full_test
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install wheel + test dependencies
        if: matrix.full_test
        run: |
          set -euo pipefail
          python -m pip install wheelhouse/*.whl
          python -m pip install "pytest>=7" "opencv-python-headless>=4.9" "jsonschema>=4" \
            "tomli>=2; python_version < '3.11'"

      - name: Run pytest
        if: matrix.full_test
        working-directory: bindings/python
        run: python -m pytest tests/ -v

      - name: Verify registry publisher and version tooling
        if: matrix.full_test
        run: |
          python -m unittest -v \
            test_publish_processing_core.py \
            test_publish_profiles.py \
            test_bump_mib_processing_version.py \
            test_contract_version_consistency.py \
            test_processing_core_wheel_architectures.py \
            test_processing_core_signer_release_gate.py \
            test_verify_processing_core_manifest.py

      - name: Verify importable version + contract
        if: matrix.full_test
        run: |
          python -c "import mib_processing as mp; print('version', mp.__version__); print('contract_version', mp.CONTRACT_VERSION); assert mp.CONTRACT_VERSION == 1"

      - name: Run full-parity conformance harness
        if: matrix.full_test
        run: |
          set -euo pipefail
          python scripts/run_processing_conformance.py \
            --candidate-out artifacts/mib-processing-conformance.json

      - name: Verify portable wheel in Biowork production base
        if: matrix.full_test && matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${{ github.workspace }}/wheelhouse:/wheelhouse:ro" \
            python:3.12-slim \
            sh -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends libgl1 libglib2.0-0
              python -m venv /tmp/mib-wheel-check
              /tmp/mib-wheel-check/bin/pip install --no-cache-dir /wheelhouse/*.whl
              /tmp/mib-wheel-check/bin/python -c "import mib_processing as mp; assert mp.CONTRACT_VERSION == 1; print(mp.__version__, mp.CONTRACT_VERSION, mp.__file__)"
            '

      - name: Upload conformance candidate
        if: always() && matrix.full_test
        uses: actions/upload-artifact@v6
        with:
          name: mib-processing-conformance-py${{ matrix.python-version }}
          path: artifacts/mib-processing-conformance.json
          if-no-files-found: ignore

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: mib_processing-wheel-${{ matrix.artifact_suffix }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-native-plugin:
    name: Build native processing core (Windows x64)
    needs: validate-source-version
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Conan and configure MSVC profile
        shell: pwsh
        env:
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
          CONAN_REMOTE_USER: ${{ secrets.CONAN_REMOTE_USER }}
          CONAN_REMOTE_PASSWORD: ${{ secrets.CONAN_REMOTE_PASSWORD }}
        run: |
          python -m pip install --upgrade pip conan
          conan profile detect --force
          @"
          [settings]
          os=Windows
          arch=x86_64
          compiler=msvc
          compiler.version=194
          compiler.cppstd=17
          compiler.runtime=dynamic
          build_type=Release
          "@ | Out-File -FilePath "$env:USERPROFILE\.conan2\profiles\ci" -Encoding UTF8
          if ($env:CONAN_REMOTE_URL) {
            conan remote add team-conan $env:CONAN_REMOTE_URL --index 0 --force
            conan remote login team-conan $env:CONAN_REMOTE_USER -p $env:CONAN_REMOTE_PASSWORD
          }

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.conan2/p
            ~/.conan2/dl
          key: conan-${{ runner.os }}-processing-core-msvc194-${{ hashFiles('conanfile.py', 'conanfile.txt') }}
          restore-keys: conan-${{ runner.os }}-processing-core-msvc194-

      - name: Install dependencies
        shell: pwsh
        run: >-
          conan install . -of build --build=missing -s build_type=Release -pr ci
          -o "opencv/*:shared=False"

      - name: Provision pinned MindVision SDK
        shell: pwsh
        run: |
          $sdk = ./scripts/provision-mindvision-sdk.ps1 -PassThru
          "MIB_MINDVISION_SDK_ROOT=$($sdk.SdkRoot)" >> $env:GITHUB_ENV
          "MIB_MINDVISION_RUNTIME_DIR=$($sdk.RuntimeDir)" >> $env:GITHUB_ENV

      - name: Configure and build native plugin
        shell: pwsh
        env:
          APP_MIN_VERSION: ${{ vars.MIB_PROCESSING_CORE_APP_MIN_VERSION }}
          APP_MAX_VERSION: ${{ vars.MIB_PROCESSING_CORE_APP_MAX_VERSION }}
        run: |
          cmake --preset windows-default `
            -DMIB_BUILD_BACKEND_ONLY=ON `
            -DMIB_ENABLE_HARDWARE_SDKS=OFF `
            -DMIB_ENABLE_WINDOWS_PACKAGING=OFF `
            -DMIB_USE_SENTRY=OFF `
            -DMIB_REQUIRE_PROCESSING_CORE_APP_COMPAT=${{ startsWith(github.ref, 'refs/tags/mib-processing-v') && 'ON' || 'OFF' }} `
            -DMIB_PROCESSING_CORE_APP_MIN_VERSION="$env:APP_MIN_VERSION" `
            -DMIB_PROCESSING_CORE_APP_MAX_VERSION="$env:APP_MAX_VERSION"
          cmake --build build --config Release --target `
            mib_processing_core `
            processing_core_abi_c_test `
            processing_core_loader_test `
            processing_core_cache_test `
            processing_core_fixture_matrix_test `
            processing_core_authenticode_test

      - name: Verify native ABI, loader, and cache
        shell: pwsh
        run: |
          $command = 'call build\conanrun.bat && ctest --test-dir build -C Release -R "processing\.core_(abi_c|loader|cache|fixture_matrix)" --output-on-failure'
          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) {
            throw "Native processing-core tests failed with exit code $LASTEXITCODE"
          }

      - name: Build and verify independently configured ABI fixtures
        shell: pwsh
        run: |
          $pyproject = Get-Content bindings/python/pyproject.toml -Raw
          if ($pyproject -notmatch '(?m)^version\s*=\s*"([^"]+)"\s*$') {
            throw 'Could not read mib-processing version from pyproject.toml'
          }
          $version = $matches[1]
          cmake -S tests/processing/fixtures -B build/processing-core-fixtures `
            -G "Visual Studio 17 2022" -A x64 `
            -DMIB_PROCESSING_ABI_HEADER_DIR="$pwd/include" `
            -DMIB_PROCESSING_CORE_VERSION="$version"
          cmake --build build/processing-core-fixtures --config Release

          $matrix = (Resolve-Path build/Release/processing_core_fixture_matrix_test.exe).Path
          $fixtureDir = (Resolve-Path build/processing-core-fixtures/Release).Path
          $arguments = @(
            (Join-Path $fixtureDir 'mib_processing_fixture_good.dll'),
            (Join-Path $fixtureDir 'mib_processing_fixture_truncated.dll'),
            (Join-Path $fixtureDir 'mib_processing_fixture_incompatible.dll'),
            (Join-Path $fixtureDir 'mib_processing_fixture_malformed.dll'),
            (Join-Path $fixtureDir 'mib_processing_fixture_throwing.dll')
          )
          $quotedArguments = ($arguments | ForEach-Object { '"' + $_ + '"' }) -join ' '
          $command = 'call build\conanrun.bat && "' + $matrix + '" ' + $quotedArguments
          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) {
            throw "Independent processing-core fixture matrix failed with exit code $LASTEXITCODE"
          }

      - name: Locate and validate release assets
        id: native-assets
        shell: pwsh
        run: |
          $pyproject = Get-Content bindings/python/pyproject.toml -Raw
          if ($pyproject -notmatch '(?m)^version\s*=\s*"([^"]+)"\s*$') {
            throw 'Could not read mib-processing version from pyproject.toml'
          }
          $version = $matches[1]
          $stem = "mib_processing_core-$version-windows_x86_64"
          $dll = Get-Item -LiteralPath "build\Release\$stem.dll" -ErrorAction SilentlyContinue
          $descriptor = Get-Item -LiteralPath "build\Release\$stem.json" -ErrorAction SilentlyContinue
          if (-not $dll -or -not $descriptor) {
            throw "Expected release assets $stem.dll and $stem.json under build/Release"
          }
          $metadata = Get-Content $descriptor.FullName -Raw | ConvertFrom-Json
          if ($metadata.filename -ne $dll.Name -or $metadata.version -ne $version) {
            throw 'Native sidecar identity does not match the built DLL/version'
          }
          $nativeDist = Join-Path $env:RUNNER_TEMP 'mib-processing-native-dist'
          Remove-Item -LiteralPath $nativeDist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $nativeDist | Out-Null
          $stagedDll = Join-Path $nativeDist $dll.Name
          $stagedDescriptor = Join-Path $nativeDist $descriptor.Name
          Copy-Item -LiteralPath $dll.FullName -Destination $stagedDll
          Copy-Item -LiteralPath $descriptor.FullName -Destination $stagedDescriptor
          "dll=$stagedDll" >> $env:GITHUB_OUTPUT
          "descriptor=$stagedDescriptor" >> $env:GITHUB_OUTPUT

      - name: Audit native plugin exports and imports
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $dumpbin = Get-ChildItem "$installation\VC\Tools\MSVC" `
            -Recurse -File -Filter dumpbin.exe |
            Where-Object { $_.FullName -match '\\bin\\Hostx64\\x64\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { throw 'MSVC x64 dumpbin.exe was not found' }

          $exports = & $dumpbin.FullName /nologo /exports '${{ steps.native-assets.outputs.dll }}'
          Write-Host ($exports -join "`n")
          $exportNames = @($exports | ForEach-Object {
            # dumpbin may append an alias/forwarder after the name. Parse the
            # stable ordinal/hint/RVA/name prefix and still count every row.
            if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') {
              $matches[1]
            }
          })
          if ($exportNames.Count -ne 1 -or $exportNames[0] -ne 'mib_processing_get_api') {
            throw "Native plugin must export exactly mib_processing_get_api; found: $($exportNames -join ', ')"
          }

          $dependents = & $dumpbin.FullName /nologo /dependents '${{ steps.native-assets.outputs.dll }}'
          Write-Host ($dependents -join "`n")
          $dependencyNames = @($dependents | ForEach-Object {
            if ($_ -match '^\s+([A-Za-z0-9_.+\-]+\.dll)\s*$') { $matches[1] }
          })
          $forbidden = @($dependencyNames | Where-Object {
            $_ -match '^(Qt|hdf5|opencv|python|mib_studio)'
          })
          if ($forbidden.Count -ne 0) {
            throw "Native plugin imports forbidden host/framework DLLs: $($forbidden -join ', ')"
          }
          Write-Host "Native imports: $($dependencyNames -join ', ')"

      - name: Verify Authenticode trust with signed SDK fixture
        shell: pwsh
        run: |
          ./scripts/test-processing-core-authenticode.ps1 `
            -TestExecutable build/Release/processing_core_authenticode_test.exe `
            -UnsignedFixture build/processing-core-fixtures/Release/mib_processing_fixture_good.dll `
            -WorkingDirectory "$env:RUNNER_TEMP/mib-processing-authenticode"

      - name: Upload unsigned native plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: mib_processing-native-windows-x86_64-unsigned
          path: ${{ runner.temp }}/mib-processing-native-dist/*
          if-no-files-found: error

  build-native-plugin-linux:
    name: Build native processing core (Linux x86_64)
    needs: validate-source-version
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            curl \
            git \
            libgl1-mesa-dev \
            libhdf5-dev \
            libopencv-dev \
            libspdlog-dev \
            libsqlite3-dev \
            libssl-dev \
            libxkbcommon-dev \
            nlohmann-json3-dev \
            pkg-config \
            python3-pip \
            qt6-base-dev \
            qt6-serialport-dev

      - name: Provision pinned MindVision SDK
        shell: bash
        run: ./scripts/provision-mindvision-sdk.sh --github-env "$GITHUB_ENV"

      - name: Configure and build native plugin
        shell: bash
        env:
          APP_MIN_VERSION: ${{ vars.MIB_PROCESSING_CORE_APP_MIN_VERSION }}
          APP_MAX_VERSION: ${{ vars.MIB_PROCESSING_CORE_APP_MAX_VERSION }}
        run: |
          set -euo pipefail
          cmake --preset linux-backend-only \
            -DMIB_USE_SENTRY=OFF \
            -DMIB_REQUIRE_PROCESSING_CORE_APP_COMPAT=${{ startsWith(github.ref, 'refs/tags/mib-processing-v') && 'ON' || 'OFF' }} \
            -DMIB_PROCESSING_CORE_APP_MIN_VERSION="$APP_MIN_VERSION" \
            -DMIB_PROCESSING_CORE_APP_MAX_VERSION="$APP_MAX_VERSION"
          cmake --build --preset linux-backend-only-build --parallel --target \
            mib_processing_core \
            processing_core_abi_c_test \
            processing_core_loader_test \
            processing_core_cache_test \
            processing_core_fixture_matrix_test \
            processing_core_ed25519_test

      - name: Verify native ABI, loader, cache, and Ed25519 trust
        shell: bash
        env:
          MIB_STUDIO_EMODULUS_LUT_MANIFEST_URL: "file:///nonexistent/mib-lut-manifest.json"
        run: |
          set -euo pipefail
          ctest --preset linux-backend-only-test \
            -R "processing\.core_(abi_c|loader|cache|fixture_matrix|ed25519)" \
            --output-on-failure

      - name: Locate and validate release assets
        id: native-assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'EOF'
          import tomllib
          with open("bindings/python/pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          EOF
          )"
          stem="mib_processing_core-${version}-linux_x86_64"
          shared_library="build/linux-backend/Release/${stem}.so"
          descriptor="build/linux-backend/Release/${stem}.json"
          test -f "$shared_library"
          test -f "$descriptor"
          python3 - "$descriptor" "$stem.so" "$version" <<'EOF'
          import json, sys
          descriptor, filename, version = sys.argv[1:]
          with open(descriptor, encoding="utf-8") as handle:
              metadata = json.load(handle)
          assert metadata["filename"] == filename, "sidecar filename mismatch"
          assert metadata["version"] == version, "sidecar version mismatch"
          assert metadata["os"] == "linux" and metadata["arch"] == "x86_64"
          assert metadata["signing"] == {"required": True, "scheme": "ed25519"}
          EOF
          staging="$RUNNER_TEMP/mib-processing-native-dist"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp "$shared_library" "$descriptor" "$staging/"
          echo "so=$staging/${stem}.so" >> "$GITHUB_OUTPUT"
          echo "descriptor=$staging/${stem}.json" >> "$GITHUB_OUTPUT"

      - name: Audit native plugin exports and imports
        shell: bash
        run: |
          set -euo pipefail
          shared_library='${{ steps.native-assets.outputs.so }}'
          exports="$(nm -D --defined-only "$shared_library" | awk '$2 == "T" {print $3}')"
          echo "Exports: $exports"
          if [ "$exports" != "mib_processing_get_api" ]; then
            echo "::error::Native plugin must export exactly mib_processing_get_api"
            exit 1
          fi
          needed="$(readelf -d "$shared_library" | awk '/NEEDED/ {gsub(/[\[\]]/, "", $5); print $5}')"
          echo "Native imports:"
          echo "$needed"
          # The Windows lane forbids OpenCV because Conan links it statically.
          # This lane uses distro OpenCV, so the dynamic libopencv/libspdlog
          # dependencies are reported but allowed; pinning them down across
          # supported distro baselines is part of the remaining A13 live gate.
          if echo "$needed" | grep -Eiq '^(libQt|libhdf5|libpython|libmib_studio)'; then
            echo "::error::Native plugin imports forbidden host/framework libraries"
            exit 1
          fi

      - name: Rehearse detached Ed25519 signing with an ephemeral key
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/mib-processing-ed25519"
          rm -rf "$workdir"
          mkdir -p "$workdir"
          openssl genpkey -algorithm ed25519 -out "$workdir/signer.pem"
          openssl pkey -in "$workdir/signer.pem" -pubout -outform DER -out "$workdir/signer-spki.der"
          openssl pkeyutl -sign -inkey "$workdir/signer.pem" -rawin \
            -in '${{ steps.native-assets.outputs.so }}' -out "$workdir/artifact.sig"
          openssl pkeyutl -verify -pubin -inkey <(openssl pkey -in "$workdir/signer.pem" -pubout) \
            -rawin -in '${{ steps.native-assets.outputs.so }}' -sigfile "$workdir/artifact.sig"
          python3 - '${{ steps.native-assets.outputs.descriptor }}' "$workdir" <<'EOF'
          import base64, hashlib, json, sys
          descriptor_path, workdir = sys.argv[1:]
          with open(f"{workdir}/signer-spki.der", "rb") as handle:
              spki = handle.read()
          with open(f"{workdir}/artifact.sig", "rb") as handle:
              signature = handle.read()
          assert len(spki) == 44 and len(signature) == 64
          with open(descriptor_path, encoding="utf-8") as handle:
              metadata = json.load(handle)
          metadata["signing"].update({
              "public_key_spki_base64": base64.b64encode(spki).decode("ascii"),
              "public_key_spki_sha256": hashlib.sha256(spki).hexdigest(),
              "signature_base64": base64.b64encode(signature).decode("ascii"),
          })
          with open(descriptor_path, "w", encoding="utf-8") as handle:
              json.dump(metadata, handle, indent=2)
              handle.write("\n")
          EOF

      - name: Validate the signed descriptor through the registry publisher
        shell: bash
        run: |
          set -euo pipefail
          python3 - '${{ steps.native-assets.outputs.descriptor }}' <<'EOF'
          import importlib.util, json, sys
          from pathlib import Path
          descriptor = Path(sys.argv[1])
          spec = importlib.util.spec_from_file_location(
              "publish_processing_core", "publish-processing-core.py")
          publisher = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(publisher)
          version = json.loads(descriptor.read_text(encoding="utf-8"))["version"]
          entries = publisher.build_native_plugin_entries(
              [descriptor],
              asset_dir=descriptor.parent,
              repo="OWNER/REPO",
              release_tag=f"mib-processing-v{version}",
              expected_version=version,
              expected_contract_version=1,
          )
          signing = entries[0]["signing"]
          assert signing["scheme"] == "ed25519" and signing["required"] is True
          assert signing["public_key_spki_sha256"]
          print("publisher accepted the ed25519-signed Linux descriptor")
          EOF

      - name: Upload unsigned native plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: mib_processing-native-linux-x86_64-unsigned
          path: ${{ runner.temp }}/mib-processing-native-dist/*
          if-no-files-found: error

  sign-native-plugin:
    name: Sign native processing core (Production)
    needs: build-native-plugin
    if: startsWith(github.ref, 'refs/tags/mib-processing-v')
    runs-on: windows-2022
    environment: Production
    permissions:
      contents: read

    steps:
      - name: Download verified unsigned native plugin
        uses: actions/download-artifact@v6
        with:
          name: mib_processing-native-windows-x86_64-unsigned
          path: native-dist

      - name: Checkout signing trust anchors
        uses: actions/checkout@v6
        with:
          path: repo
          sparse-checkout: |
            deploy/signing
          sparse-checkout-cone-mode: false

      # The KPT organizational root must be trusted for
      # Get-AuthenticodeSignature to report Valid; the SPKI pin comparison
      # below stays the actual trust decision. The store mutation is scoped
      # to this ephemeral tag-gated Production runner and uses the .NET
      # X509Store API because certutil hangs on hosted images (#239).
      - name: Trust the committed organizational signing root
        shell: pwsh
        run: |
          $root = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            (Resolve-Path 'repo/deploy/signing/kpt-mib-studio-root-ca.cer').Path)
          $basicConstraints = $root.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.19' }
          if (-not $basicConstraints) {
            throw 'Committed trust anchor is missing basic constraints'
          }
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('Root', 'LocalMachine')
          $store.Open('ReadWrite')
          try { $store.Add($root) } finally { $store.Dispose() }
          Write-Host "Trusted organizational root: $($root.Subject) ($($root.Thumbprint))"

      - name: Sign and verify native plugin
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          PROCESSING_CORE_SIGNER_SPKI_SHA256: ${{ vars.MIB_PROCESSING_CORE_SIGNER_SPKI_SHA256 }}
        run: |
          if (-not $env:SIGNING_CERTIFICATE_BASE64 -or -not $env:SIGNING_CERTIFICATE_PASSWORD) {
            throw 'Release tags require WINDOWS_SIGNING_CERTIFICATE_BASE64 and WINDOWS_SIGNING_CERTIFICATE_PASSWORD'
          }
          if ($env:PROCESSING_CORE_SIGNER_SPKI_SHA256 -notmatch '^[0-9A-Fa-f]{64}$') {
            throw 'Release tags require repository variable MIB_PROCESSING_CORE_SIGNER_SPKI_SHA256 as a non-empty 64-hex DER-SPKI SHA-256'
          }

          function Get-SignerSpkiSha256(
            [System.Security.Cryptography.X509Certificates.X509Certificate2] $Certificate
          ) {
            $key = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPublicKey($Certificate)
            if (-not $key) {
              $key = [System.Security.Cryptography.X509Certificates.ECDsaCertificateExtensions]::GetECDsaPublicKey($Certificate)
            }
            if (-not $key) {
              throw 'The Authenticode signer uses an unsupported public-key algorithm'
            }
            try {
              $subjectPublicKeyInfo = $key.ExportSubjectPublicKeyInfo()
            } finally {
              $key.Dispose()
            }
            $sha256 = [System.Security.Cryptography.SHA256]::Create()
            try {
              $digest = $sha256.ComputeHash($subjectPublicKeyInfo)
            } finally {
              $sha256.Dispose()
            }
            return (($digest | ForEach-Object { $_.ToString('x2') }) -join '')
          }

          $dlls = @(Get-ChildItem native-dist -File -Filter 'mib_processing_core-*-windows_x86_64.dll')
          if ($dlls.Count -ne 1) {
            throw "Expected exactly one native plugin DLL, found $($dlls.Count)"
          }
          $dll = $dlls[0]
          $certificate = Join-Path $env:RUNNER_TEMP 'mib-processing-signing.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $certificate,
              [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
            )
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Recurse -File -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe (x64) was not found' }
            & $signtool.FullName sign /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $certificate /p $env:SIGNING_CERTIFICATE_PASSWORD `
              $dll.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
            $signature = Get-AuthenticodeSignature $dll.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode verification failed: $($signature.Status) $($signature.StatusMessage)"
            }
            if (-not $signature.SignerCertificate) {
              throw 'Authenticode verification did not return the signer certificate'
            }
            $actualSignerSpki = Get-SignerSpkiSha256 $signature.SignerCertificate
            $approvedSignerSpki = $env:PROCESSING_CORE_SIGNER_SPKI_SHA256.ToLowerInvariant()
            if ($actualSignerSpki -ne $approvedSignerSpki) {
              throw "Signed DLL DER-SPKI SHA-256 $actualSignerSpki does not match repository trust pin $approvedSignerSpki"
            }
            Write-Host "Signed DLL DER-SPKI SHA-256 matches the repository trust pin: $actualSignerSpki"
          } finally {
            Remove-Item $certificate -Force -ErrorAction SilentlyContinue
          }

      - name: Upload signed native plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: mib_processing-native-windows-x86_64
          path: native-dist/*
          if-no-files-found: error

  sign-native-plugin-linux:
    name: Sign native processing core (Linux, Production)
    needs: build-native-plugin-linux
    if: startsWith(github.ref, 'refs/tags/mib-processing-v')
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      contents: read

    steps:
      - name: Download verified unsigned native plugin
        uses: actions/download-artifact@v6
        with:
          name: mib_processing-native-linux-x86_64-unsigned
          path: native-dist

      # The staged descriptor carries the PR-lane rehearsal envelope from an
      # ephemeral key; this step replaces every transported signing field
      # with the production envelope. The key must match the repository
      # DER-SPKI pin before any signature is produced.
      - name: Sign with the production Ed25519 key and inject the envelope
        shell: bash
        env:
          ED25519_SIGNING_KEY_PEM: ${{ secrets.LINUX_ED25519_SIGNING_KEY_PEM }}
          PROCESSING_CORE_ED25519_SPKI_SHA256: ${{ vars.MIB_PROCESSING_CORE_ED25519_SPKI_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${ED25519_SIGNING_KEY_PEM:-}" ]; then
            echo "::error::Release tags require the Production secret LINUX_ED25519_SIGNING_KEY_PEM"
            exit 1
          fi
          if ! printf '%s' "${PROCESSING_CORE_ED25519_SPKI_SHA256:-}" | grep -Eqx '[0-9A-Fa-f]{64}'; then
            echo "::error::Release tags require repository variable MIB_PROCESSING_CORE_ED25519_SPKI_SHA256 as a non-empty 64-hex DER-SPKI SHA-256"
            exit 1
          fi
          shopt -s nullglob
          libraries=(native-dist/mib_processing_core-*-linux_x86_64.so)
          if [ "${#libraries[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one native plugin .so, found ${#libraries[@]}"
            exit 1
          fi
          shared_library="${libraries[0]}"
          descriptor="${shared_library%.so}.json"
          test -f "$descriptor"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          umask 077
          printf '%s\n' "$ED25519_SIGNING_KEY_PEM" > "$workdir/signer.pem"
          openssl pkey -in "$workdir/signer.pem" -pubout -outform DER -out "$workdir/signer-spki.der"
          actual_spki="$(openssl dgst -sha256 -r "$workdir/signer-spki.der" | cut -d' ' -f1)"
          approved_spki="$(printf '%s' "$PROCESSING_CORE_ED25519_SPKI_SHA256" | tr 'A-F' 'a-f')"
          if [ "$actual_spki" != "$approved_spki" ]; then
            echo "::error::Signing key DER-SPKI SHA-256 $actual_spki does not match repository trust pin $approved_spki"
            exit 1
          fi
          openssl pkeyutl -sign -inkey "$workdir/signer.pem" -rawin \
            -in "$shared_library" -out "$workdir/artifact.sig"
          openssl pkeyutl -verify -pubin -inkey "$workdir/signer-spki.der" -keyform DER \
            -rawin -in "$shared_library" -sigfile "$workdir/artifact.sig"
          python3 - "$descriptor" "$workdir" "$approved_spki" <<'EOF'
          import base64, hashlib, json, sys
          descriptor_path, workdir, approved_spki = sys.argv[1:]
          with open(f"{workdir}/signer-spki.der", "rb") as handle:
              spki = handle.read()
          with open(f"{workdir}/artifact.sig", "rb") as handle:
              signature = handle.read()
          if len(spki) != 44 or len(signature) != 64:
              raise SystemExit("non-canonical Ed25519 SPKI or signature length")
          if hashlib.sha256(spki).hexdigest() != approved_spki:
              raise SystemExit("SPKI hash diverged from the approved repository pin")
          with open(descriptor_path, encoding="utf-8") as handle:
              metadata = json.load(handle)
          signing = metadata.get("signing", {})
          if signing.get("scheme") != "ed25519" or signing.get("required") is not True:
              raise SystemExit("descriptor does not declare the required ed25519 scheme")
          signing.update({
              "public_key_spki_base64": base64.b64encode(spki).decode("ascii"),
              "public_key_spki_sha256": hashlib.sha256(spki).hexdigest(),
              "signature_base64": base64.b64encode(signature).decode("ascii"),
          })
          metadata["signing"] = signing
          with open(descriptor_path, "w", encoding="utf-8") as handle:
              json.dump(metadata, handle, indent=2)
              handle.write("\n")
          print("injected production ed25519 envelope into the sidecar descriptor")
          EOF

      - name: Upload signed native plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: mib_processing-native-linux-x86_64
          path: native-dist/*
          if-no-files-found: error

  release:
    name: Publish processing-core GitHub Release and registry
    needs: [validate-source-version, build-and-test, sign-native-plugin, sign-native-plugin-linux]
    if: startsWith(github.ref, 'refs/tags/mib-processing-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: processing-core-registry-${{ needs.validate-source-version.outputs.channel }}
      cancel-in-progress: false

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: mib_processing-wheel-py*
          path: dist
          merge-multiple: true

      - name: Download native plugin artifact
        uses: actions/download-artifact@v6
        with:
          name: mib_processing-native-windows-x86_64
          path: dist

      - name: Download Linux native plugin artifact
        uses: actions/download-artifact@v6
        with:
          name: mib_processing-native-linux-x86_64
          path: dist

      - name: List processing-core release assets
        run: ls -la dist/

      - name: Validate flat release asset set
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path("dist")
          nested = sorted(
              str(path.relative_to(root))
              for path in root.rglob("*")
              if path.is_file() and path.parent != root
          )
          if nested:
              raise SystemExit(f"nested release asset paths are forbidden: {nested}")

          version = os.environ["GITHUB_REF"].removeprefix("refs/tags/mib-processing-v")
          names = {path.name for path in root.iterdir() if path.is_file()}
          expected_native = {
              f"mib_processing_core-{version}-windows_x86_64.dll",
              f"mib_processing_core-{version}-windows_x86_64.json",
              f"mib_processing_core-{version}-linux_x86_64.so",
              f"mib_processing_core-{version}-linux_x86_64.json",
          }
          wheel_pattern = re.compile(
              rf"mib_processing-{re.escape(version)}-cp(310|311|312|313)-cp\1-"
              r"manylinux_2_28_(x86_64|aarch64)\.whl"
          )
          wheels = {name for name in names if name.endswith(".whl")}
          wheel_targets = {
              (match.group(1), match.group(2))
              for name in wheels
              if (match := wheel_pattern.fullmatch(name))
          }
          expected_wheel_targets = {
              (python_tag, architecture)
              for python_tag in {"310", "311", "312", "313"}
              for architecture in {"x86_64", "aarch64"}
          }
          expected = wheels | expected_native
          if (
              len(wheels) != 8
              or wheel_targets != expected_wheel_targets
              or names != expected
          ):
              raise SystemExit(
                  "staged release asset set is not canonical; "
                  f"names={sorted(names)}, wheel_targets={sorted(wheel_targets)}"
              )
          print("Flat release asset set is complete and canonical.")
          PY

      - name: Create or verify immutable processing-core release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROCESSING_CHANNEL: ${{ needs.validate-source-version.outputs.channel }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" --repo "${{ github.repository }}" \
              --json assets,isPrerelease > /tmp/existing-release.json 2>/dev/null; then
            # The GitHub Release is the immutable source of truth. Rebuilds are
            # not byte-reproducible (especially timestamped Authenticode), so a
            # retry after an R2 outage validates and reuses the original assets.
            python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["GITHUB_REF"].removeprefix("refs/tags/")
          version = tag.removeprefix("mib-processing-v")
          names = {
              asset["name"]
              for asset in json.loads(Path("/tmp/existing-release.json").read_text())["assets"]
          }
          is_prerelease = json.loads(Path("/tmp/existing-release.json").read_text())["isPrerelease"]
          expected_prerelease = os.environ["PROCESSING_CHANNEL"] == "beta"
          if is_prerelease != expected_prerelease:
              raise SystemExit(
                  f"existing release prerelease={is_prerelease} does not match "
                  f"channel {os.environ['PROCESSING_CHANNEL']}"
              )
          wheels = sorted(name for name in names if name.endswith(".whl"))
          expected_native = {
              f"mib_processing_core-{version}-windows_x86_64.dll",
              f"mib_processing_core-{version}-windows_x86_64.json",
              f"mib_processing_core-{version}-linux_x86_64.so",
              f"mib_processing_core-{version}-linux_x86_64.json",
          }
          wheel_pattern = re.compile(
              rf"mib_processing-{re.escape(version)}-cp(310|311|312|313)-cp\1-"
              r"manylinux_2_28_(x86_64|aarch64)\.whl"
          )
          wheel_targets = {
              (match.group(1), match.group(2))
              for name in wheels
              if (match := wheel_pattern.fullmatch(name))
          }
          expected_wheel_targets = {
              (python_tag, architecture)
              for python_tag in {"310", "311", "312", "313"}
              for architecture in {"x86_64", "aarch64"}
          }
          unexpected = sorted(names - set(wheels) - expected_native)
          if (
              len(wheels) != 8
              or wheel_targets != expected_wheel_targets
              or not expected_native.issubset(names)
              or unexpected
          ):
              raise SystemExit(
                  "existing release does not have the complete canonical asset set; "
                  f"wheels={wheels}, native_missing={sorted(expected_native - names)}, "
                  f"wheel_targets={sorted(wheel_targets)}, unexpected={unexpected}"
              )
          print("Existing immutable release asset set is complete; reusing it for R2 publish.")
          PY
          else
            release_flags=()
            if [ "$PROCESSING_CHANNEL" = beta ]; then
              release_flags+=(--prerelease)
            fi
            # Never claim the repository "Latest" badge: that must always
            # point at the newest stable desktop release, not core wheels.
            release_flags+=(--latest=false)
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --verify-tag \
              --title "$tag" \
              --notes "mib-processing wheels and signed Windows/Linux processing-core plugins for tag $tag. See bindings/python/README.md and docs/portable-processing-sync.md for compatibility notes." \
              --generate-notes \
              "${release_flags[@]}" \
              dist/*
          fi

      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Set up registry publisher
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Publish immutable registry, indexes, then active pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MIB_STUDIO_R2_ENDPOINT: ${{ secrets.MIB_STUDIO_R2_ENDPOINT }}
          PROCESSING_CHANNEL: ${{ needs.validate-source-version.outputs.channel }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -z "${MIB_STUDIO_R2_ENDPOINT:-}" ]; then
            echo "R2 registry publication requires R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, and MIB_STUDIO_R2_ENDPOINT" >&2
            exit 1
          fi
          python -m pip install --upgrade pip boto3
          tag="${GITHUB_REF#refs/tags/}"
          python publish-processing-core.py \
            --from-release "$tag" \
            --repo "${{ github.repository }}" \
            --channel "$PROCESSING_CHANNEL" \
            --upload-method s3
