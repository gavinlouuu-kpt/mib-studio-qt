name: Build Windows

on:
  push:
    branches: [develop]
    # Dev-lane release gate: a develop merge only cuts an auto-beta when it
    # can change the shipped desktop app. Docs, vault, tooling/exploration,
    # wheel-lane, and other-workflow merges must not advance the beta channel
    # (later patterns win; the final re-include keeps edits to this workflow
    # itself releasing so pipeline changes are exercised).
    paths:
      - '**'
      - '!docs/**'
      - '!knowledge_map/**'
      - '!tools/**'
      - '!tests/**'
      - '!bindings/python/**'
      - '!mkdocs.yml'
      - '!**.md'
      - '!.github/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        required: true
        type: choice
        options:
          - beta
          - release
      bump:
        description: 'Version bump type (release mode only)'
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
      # Release mode opens the fallback-version sync PR into develop.
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # This must run before the prospective version is written into the local
      # workspace. Git refs are not mutated until every build/package gate has
      # succeeded near the end of the job.
      - name: Validate processing-core signer trust pin
        shell: pwsh
        env:
          PROCESSING_CORE_SIGNER_SPKI_SHA256: ${{ vars.MIB_PROCESSING_CORE_SIGNER_SPKI_SHA256 }}
        run: |
          if ($env:PROCESSING_CORE_SIGNER_SPKI_SHA256 -notmatch '^[0-9A-Fa-f]{64}$') {
            throw 'Repository variable MIB_PROCESSING_CORE_SIGNER_SPKI_SHA256 must be a non-empty 64-hex DER-SPKI SHA-256 before a desktop release can build'
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Version ────────────────────────────────────────────────
      - name: Determine prospective version
        id: version
        shell: pwsh
        run: |
          $bump = if ('${{ inputs.mode }}' -eq 'release') { '${{ inputs.bump }}' } else { 'none' }
          $versionInfoJson = python scripts/resolve_desktop_release_version.py --bump $bump
          if ($LASTEXITCODE -ne 0) { throw 'Desktop release version resolution failed' }
          $versionInfo = $versionInfoJson | ConvertFrom-Json
          $versionFile = "cmake/MIBVersion.cmake"
          $content = Get-Content $versionFile -Raw
          $default = [string]$versionInfo.default_version
          $current = [string]$versionInfo.current_version

          if ("${{ inputs.mode }}" -eq "release") {
            $version = [string]$versionInfo.next_version
            $tag = "v$version"
            $channel = "stable"
            $artifactVersion = $version

            # Configure/build/package the prospective tree, but do not commit,
            # tag, or push until every gate has passed.
            $updated = $content -replace "set\(DEFAULT_VERSION\s+`"$([regex]::Escape($default))`"\)", "set(DEFAULT_VERSION `"$version`")"
            if ($updated -eq $content) {
              throw "Could not replace DEFAULT_VERSION $default with $version"
            }
            Set-Content -Path $versionFile -Value $updated -NoNewline
            Write-Host "Prospective release: effective $current -> $version (fallback was $default; refs unchanged)"
          } else {
            # Beta: use the effective reachable version + short SHA, no commit.
            $sha = (git rev-parse --short HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $sha) { throw 'Could not resolve beta commit SHA' }
            $version = "$current-beta.$sha"
            $tag = "v$version"
            $channel = "beta"
            $artifactVersion = $current
            Write-Host "Beta: $version (effective numeric version $current; no version bump)"
          }

          $existingTag = @(git tag --list $tag)
          if ($LASTEXITCODE -ne 0) { throw "Could not check release tag $tag" }
          if ($existingTag.Count -ne 0) { throw "Release tag already exists: $tag" }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "artifact_version=$artifactVersion" >> $env:GITHUB_OUTPUT
          "current_version=$current" >> $env:GITHUB_OUTPUT

      # ── Build environment ──────────────────────────────────────

      - name: Install Conan
        run: |
          pip install conan boto3 numpy
          conan profile detect --force
          # Create CI profile pinned to msvc 194 to match prebuilt binaries on conancenter
          @"
          [settings]
          os=Windows
          arch=x86_64
          compiler=msvc
          compiler.version=194
          compiler.cppstd=17
          compiler.runtime=dynamic
          build_type=Release
          "@ | Out-File -FilePath "$env:USERPROFILE\.conan2\profiles\ci" -Encoding UTF8
          Write-Host "CI Conan profile created:"
          conan profile show -pr ci

          # Add team Conan remote as primary
          if ($env:CONAN_REMOTE_URL) {
            conan remote add team-conan $env:CONAN_REMOTE_URL --index 0
            conan remote login team-conan $env:CONAN_REMOTE_USER -p $env:CONAN_REMOTE_PASSWORD
            Write-Host "Team Conan remote configured"
          } else {
            Write-Host "CONAN_REMOTE_URL not set, using ConanCenter only" -ForegroundColor Yellow
          }
        shell: pwsh
        env:
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
          CONAN_REMOTE_USER: ${{ secrets.CONAN_REMOTE_USER }}
          CONAN_REMOTE_PASSWORD: ${{ secrets.CONAN_REMOTE_PASSWORD }}

      - name: Restore Conan cache
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.conan2/p
            ~/.conan2/dl
          key: conan-${{ runner.os }}-msvc194-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-msvc194-

      - name: Download eGrabber SDK
        run: |
          $sdkUrl = "https://updates.yofo.bio/egrabber-sdk-installer/egrabber-win-x86_64-25.10.0.57.exe"
          curl.exe --fail --location --retry 3 --output egrabber-sdk.exe $sdkUrl
          $sdkSize = (Get-Item egrabber-sdk.exe).Length
          if ($sdkSize -lt 100MB) {
            Write-Host "ERROR: Downloaded eGrabber SDK is unexpectedly small: $sdkSize bytes" -ForegroundColor Red
            exit 1
          }
          $installer = Start-Process -FilePath .\egrabber-sdk.exe -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            Write-Host "ERROR: eGrabber SDK installer failed with exit code $($installer.ExitCode)" -ForegroundColor Red
            exit $installer.ExitCode
          }
          if (!(Test-Path "C:\Program Files\Euresys\eGrabber\include")) {
            Write-Host "ERROR: eGrabber SDK headers not found" -ForegroundColor Red
            exit 1
          }
          Write-Host "eGrabber SDK installed"
          New-Item -ItemType Directory -Force resources\installers | Out-Null
          Copy-Item egrabber-sdk.exe resources\installers\egrabber-win-x86_64-25.10.0.57.exe
        shell: pwsh

      - name: Download VC++ Redistributable
        run: |
          New-Item -ItemType Directory -Force resources\installers | Out-Null
          curl.exe --fail --location --retry 3 --output resources\installers\vc_redist.x64.exe "https://aka.ms/vs/17/release/vc_redist.x64.exe"
        shell: pwsh

      - name: Provision pinned MindVision SDK
        shell: pwsh
        run: |
          $sdk = .\scripts\provision-mindvision-sdk.ps1 `
            -Destination build\vendor\mindvision-sdk `
            -PassThru
          "MIB_MINDVISION_SDK_ROOT=$($sdk.SdkRoot)" >> $env:GITHUB_ENV
          "MIB_MINDVISION_RUNTIME_DIR=$($sdk.RuntimeDir)" >> $env:GITHUB_ENV

      # ── Build ──────────────────────────────────────────────────
      - name: Conan install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          conan install . -of build --build=missing -s build_type=Release -pr ci
          if ($LASTEXITCODE -ne 0) {
            Write-Host "WARNING: Conan install failed with current remotes (possibly team-conan). Retrying after disabling team-conan remote." -ForegroundColor Yellow
            conan remote remove team-conan 2>$null
            conan install . -of build --build=missing -s build_type=Release -pr ci
            if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: Conan install failed after removing team-conan remote." -ForegroundColor Red
              exit 1
            }
          }

      - name: Upload packages to team remote
        if: always() && env.CONAN_REMOTE_URL != ''
        continue-on-error: true
        run: conan upload "*" -r team-conan -c
        env:
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}

      - name: Save Conan cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.conan2/p
            ~/.conan2/dl
          key: conan-${{ runner.os }}-msvc194-${{ hashFiles('conanfile.txt') }}

      - name: CMake configure
        env:
          MIB_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MIB_SENTRY_ENV: ${{ steps.version.outputs.channel == 'stable' && 'production' || 'beta' }}
          PROCESSING_CORE_SIGNER_SPKI_SHA256: ${{ vars.MIB_PROCESSING_CORE_SIGNER_SPKI_SHA256 }}
        run: |
          # Bake the Sentry DSN into the installer (HKLM env var) so installed
          # builds report crashes without per-user configuration. The DSN is a
          # public identifier on the Sentry side, but we still treat it as a
          # secret because anyone who knows it can submit events that count
          # against quota.
          # The pinned R2 artifact is provisioned above. Keep MindVision
          # explicit so a stale CMake cache can never produce a release stub.
          $args = @(
            '--preset',
            'windows-default',
            '-DMIB_ENABLE_MINDVISION=ON',
            "-DMIB_MINDVISION_SDK_ROOT=$env:MIB_MINDVISION_SDK_ROOT",
            "-DMIB_MINDVISION_RUNTIME_DIR=$env:MIB_MINDVISION_RUNTIME_DIR",
            '-DMIB_REQUIRE_PROCESSING_CORE_SIGNER_SPKI=ON',
            "-DMIB_PROCESSING_CORE_SIGNER_SPKI_SHA256=$env:PROCESSING_CORE_SIGNER_SPKI_SHA256",
            '-DMIB_RELEASE_VERSION_OVERRIDE=${{ steps.version.outputs.artifact_version }}',
            '-DMIB_RELEASE_VERSION_FULL_OVERRIDE=${{ steps.version.outputs.version }}'
          )
          if ($env:MIB_SENTRY_DSN) {
            $args += "-DMIB_SENTRY_DSN=$env:MIB_SENTRY_DSN"
            $args += "-DMIB_SENTRY_ENVIRONMENT=$env:MIB_SENTRY_ENV"
            Write-Host "Sentry DSN injected into installer (env=$env:MIB_SENTRY_ENV)"
          } else {
            Write-Host "WARNING: SENTRY_DSN secret not set; installer will ship without DSN (local-only crash mode)" -ForegroundColor Yellow
          }
          cmake @args
        shell: pwsh

      - name: Validate configured release identity
        shell: pwsh
        run: |
          $identity = @{}
          Get-Content -LiteralPath build\mib-release-identity.txt | ForEach-Object {
            $parts = $_ -split '=', 2
            if ($parts.Count -eq 2) { $identity[$parts[0]] = $parts[1] }
          }
          if ($identity.version -ne '${{ steps.version.outputs.artifact_version }}' -or
              $identity.full_version -ne '${{ steps.version.outputs.version }}') {
            throw "Configured release identity diverged: numeric=$($identity.version), full=$($identity.full_version)"
          }

      - name: CMake build
        # CTest registers independent executables; build the default/all target
        # so every registered test binary exists before the test gate.
        run: cmake --build build --config Release

      - name: Verify crash-reporting artifacts
        run: |
          $required = @(
            'build\Release\mib_studio_qt.exe',
            'build\Release\mib_studio_qt.pdb',
            'build\Release\MVCAMSDK_X64.dll'
          )
          $missing = @()
          foreach ($p in $required) {
            if (Test-Path $p) {
              $size = (Get-Item $p).Length / 1MB
              Write-Host ("OK: {0} ({1:N1} MB)" -f $p, $size)
            } else {
              $missing += $p
            }
          }
          if (Test-Path 'build\Release\crashpad_handler.exe') {
            Write-Host "OK: crashpad_handler.exe present"
          } else {
            Write-Host "WARN: crashpad_handler.exe missing — sentry-native fetch may have failed; crashes will use the local-only minidump path" -ForegroundColor Yellow
          }
          if ($missing.Count -gt 0) {
            Write-Host "ERROR: missing required build artifacts:" -ForegroundColor Red
            $missing | ForEach-Object { Write-Host "  - $_" -ForegroundColor Red }
            exit 1
          }
        shell: pwsh

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure --timeout 30

      # ── Sentry symbol upload ──────────────────────────────────
      # Upload mib_studio_qt.pdb (and the sentry-native runtime PDBs if
      # built) so remote minidumps can be symbolicated. Also creates a
      # Sentry release tagged with the same version so crashes group by
      # release in the dashboard.
      #
      # Required secrets:
      #   SENTRY_AUTH_TOKEN  — auth token with project:releases and
      #                        project:write scopes
      #   SENTRY_DSN         — used at runtime; also used here for upload
      #   SENTRY_URL         — base URL of the self-hosted instance
      #                        (e.g. https://sentry.yofo.bio). Omit for
      #                        sentry.io.
      #   SENTRY_ORG         — org slug
      #   SENTRY_PROJECT     — project slug
      - name: Upload debug symbols + create Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          # Secrets aren't accessible in step-level `if:` conditions, so we
          # gate inside the shell instead — skip cleanly when the auth token
          # is missing (e.g. local fork builds without secret access).
          if (-not $env:SENTRY_AUTH_TOKEN) {
            Write-Host "Skipping Sentry symbol upload: SENTRY_AUTH_TOKEN not set" -ForegroundColor Yellow
            exit 0
          }
          if (-not $env:SENTRY_ORG -or -not $env:SENTRY_PROJECT) {
            Write-Host "ERROR: SENTRY_AUTH_TOKEN is set but SENTRY_ORG / SENTRY_PROJECT are missing." -ForegroundColor Red
            exit 1
          }
          if (-not $env:SENTRY_URL) {
            Write-Host "SENTRY_URL not set; defaulting to sentry.io" -ForegroundColor Yellow
          }

          npm install -g @sentry/cli
          sentry-cli --version

          $version = "${{ steps.version.outputs.version }}"
          $release = "mib_studio_qt@$version"

          # debug-files upload walks the directory and uploads every PDB /
          # EXE it finds. --include-sources embeds the original source paths
          # into the symbol map for nicer stack frames.
          sentry-cli debug-files upload --include-sources build\Release

          # Verify that the uploaded symbols contain valid debug IDs so
          # minidumps submitted via sentry_capture_minidump can be
          # symbolicated. Fails the step if no debug info is found.
          sentry-cli debug-files check build\Release\mib_studio_qt.pdb

          # Tie this build to a Sentry release so events arriving with
          # release="mib_studio_qt@$version" group cleanly in the UI.
          sentry-cli releases new $release
          sentry-cli releases set-commits $release --auto --ignore-missing
          sentry-cli releases finalize $release
        shell: pwsh

      # ── User-manual screenshots ────────────────────────────────
      # screenshot_tour drives the real UI headless in mock-camera mode and
      # regenerates docs/manual/images (see docs/manual/README.md). Failures
      # warn instead of blocking the release, but they are never silent.
      - name: Build screenshot tour
        run: cmake --build build --config Release --target screenshot_tour

      # The native platform is deliberate: the Conan Qt offscreen plugin
      # deadlocks inside QApplication on Windows runners (rehearsal run
      # 29334787107 hung here for the 6-hour job limit). Screenshots are
      # optional for a release, so a bounded failure degrades to the
      # existing warning path instead of consuming the job.
      - name: Generate user-manual screenshots
        id: screenshots
        timeout-minutes: 20
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: windows
          MIB_MOCK_CAMERA_DIR: ${{ github.workspace }}\data\mock_frames
        run: |
          & build\Release\screenshot_tour.exe --out docs\manual\images
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::screenshot_tour failed (exit $LASTEXITCODE) - user-manual screenshots were NOT refreshed for this build"
            "ok=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          "ok=true" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload manual screenshots
        if: steps.screenshots.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: manual-screenshots-${{ steps.version.outputs.version }}
          path: docs/manual/images/
          if-no-files-found: error

      - name: Install InnoSetup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Clean installer output directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\dist | Out-Null
          Get-ChildItem -LiteralPath build\dist -Filter 'MIB_Studio_Qt_*' -File `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^MIB_Studio_Qt_(Setup|Update)_v.+\.exe$' } |
            Remove-Item -Force

      - name: Build full installer
        run: cmake --build build --config Release --target package_installer

      - name: Build update package
        run: cmake --build build --config Release --target package_installer_update

      # ── Artifacts ──────────────────────────────────────────────
      - name: Validate exact installer artifacts
        id: installers
        shell: pwsh
        run: |
          $artifactVersion = '${{ steps.version.outputs.artifact_version }}'
          $setupPath = Join-Path $PWD "build\dist\MIB_Studio_Qt_Setup_v$artifactVersion.exe"
          $updatePath = Join-Path $PWD "build\dist\MIB_Studio_Qt_Update_v$artifactVersion.exe"
          foreach ($path in @($setupPath, $updatePath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected exact installer artifact was not produced: $path"
            }
          }
          $expected = @($setupPath, $updatePath)
          $unexpected = Get-ChildItem -LiteralPath build\dist -Filter 'MIB_Studio_Qt_*' -File |
            Where-Object {
              $_.Name -match '^MIB_Studio_Qt_(Setup|Update)_v.+\.exe$' -and
              $_.FullName -notin $expected
            }
          if ($unexpected) {
            throw "Unexpected installer artifacts were produced: $($unexpected.Name -join ', ')"
          }
          $setupHash = (Get-FileHash -Algorithm SHA256 $setupPath).Hash.ToLowerInvariant()
          $updateHash = (Get-FileHash -Algorithm SHA256 $updatePath).Hash.ToLowerInvariant()
          "setup_hash=$setupHash" >> $env:GITHUB_OUTPUT
          "update_hash=$updateHash" >> $env:GITHUB_OUTPUT
          Write-Host "Setup SHA-256:  $setupHash"
          Write-Host "Update SHA-256: $updateHash"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-${{ steps.version.outputs.version }}
          path: |
            build/dist/MIB_Studio_Qt_Setup_v${{ steps.version.outputs.artifact_version }}.exe
            build/dist/MIB_Studio_Qt_Update_v${{ steps.version.outputs.artifact_version }}.exe
          if-no-files-found: error

      # Stable release mode is allowed to mutate refs only after configure,
      # build, tests, screenshot artifact handling, packaging, exact-artifact
      # validation, and artifact upload have all succeeded.
      #
      # TAG-FIRST: only the release tag is pushed, pointing at the exact
      # trigger SHA that was built and validated. `main` is never pushed —
      # its branch protection (PR + required checks) rejects direct pushes,
      # including this workflow's own GITHUB_TOKEN (GH006, see the v1.0.7
      # first attempt). Version resolution is tag-based everywhere
      # (scripts/resolve_desktop_release_version.py takes the max of
      # DEFAULT_VERSION and reachable v* tags; cmake/MIBVersion.cmake reads
      # git tags at configure time), so the tag alone is sufficient for all
      # future version math. The DEFAULT_VERSION fallback bump and any
      # refreshed manual screenshots ride back to develop in a sync PR
      # opened by the follow-up step below.
      - name: Publish verified release tag
        if: inputs.mode == 'release'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'Stable release mode must be dispatched from refs/heads/main'
          }
          git fetch origin main --tags --force
          $remoteMain = (git rev-parse refs/remotes/origin/main).Trim()
          if ($remoteMain -ne $env:TRIGGER_SHA) {
            throw "origin/main moved from tested SHA $env:TRIGGER_SHA to $remoteMain; rerun the release"
          }

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -eq 0) {
            throw "Release tag $env:RELEASE_TAG already exists; refusing to move it"
          }
          git tag -a "$env:RELEASE_TAG" -m "Version $env:RELEASE_VERSION" $env:TRIGGER_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Release tag creation failed' }
          git push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag push failed' }

      # Best-effort follow-up: land the DEFAULT_VERSION fallback bump (and
      # refreshed screenshots) back on develop through the normal PR lane.
      # The release itself is already published via the tag above, so a
      # failure here warns instead of aborting the remaining publish steps.
      # Note: PRs opened with GITHUB_TOKEN do not auto-trigger CI; if the
      # checks are needed, close and reopen the PR (human actor) to start
      # them.
      - name: Open fallback-version sync PR into develop
        if: inputs.mode == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SCREENSHOTS_OK: ${{ steps.screenshots.outputs.ok }}
        run: |
          $syncBranch = "chore/release-$env:RELEASE_TAG-sync"
          try {
            git add -- cmake/MIBVersion.cmake
            if ($env:SCREENSHOTS_OK -eq 'true') {
              git add -- docs/manual/images
            }
            git diff --cached --check
            if ($LASTEXITCODE -ne 0) { throw 'Sync commit failed whitespace validation' }
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'No fallback/screenshot changes to sync; skipping PR'
              exit 0
            }
            git commit -m "chore: sync DEFAULT_VERSION fallback to $env:RELEASE_VERSION after $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Sync commit failed' }
            git push origin "HEAD:refs/heads/$syncBranch"
            if ($LASTEXITCODE -ne 0) { throw 'Sync branch push failed' }
            $prBody = @(
              "Automated follow-up to the $env:RELEASE_TAG stable release (tag-first flow).",
              "",
              "Updates the no-git ``DEFAULT_VERSION`` fallback in ``cmake/MIBVersion.cmake``",
              "to $env:RELEASE_VERSION and lands any refreshed manual screenshots. Version",
              "resolution itself is tag-based, so this PR only keeps the fallback fresh.",
              "",
              "If required checks did not start (PRs opened by GITHUB_TOKEN do not trigger",
              "CI), close and reopen this PR to run them."
            ) -join [Environment]::NewLine
            & gh pr create --base develop --head $syncBranch `
              --title "chore: sync version fallback after $env:RELEASE_TAG" `
              --body $prBody
            if ($LASTEXITCODE -ne 0) { throw 'Sync PR creation failed' }
          } catch {
            Write-Host "::warning::Fallback sync PR failed ($_); the $env:RELEASE_TAG release is unaffected. Sync cmake/MIBVersion.cmake DEFAULT_VERSION to $env:RELEASE_VERSION manually via a PR to develop."
          }
          # This step is best-effort by contract (see the comment above the
          # step): a caught failure must not fail the job, or the release /
          # R2 publish steps below never run (v1.0.7: gh pr create was
          # denied by repo policy and the leftover $LASTEXITCODE=1 killed
          # the job before "Create GitHub Release").
          exit 0

      # ── GitHub Release ─────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $channel = "${{ steps.version.outputs.channel }}"
          $artifactVersion = '${{ steps.version.outputs.artifact_version }}'
          $installers = @(
            (Get-Item -LiteralPath "build\dist\MIB_Studio_Qt_Setup_v$artifactVersion.exe").FullName,
            (Get-Item -LiteralPath "build\dist\MIB_Studio_Qt_Update_v$artifactVersion.exe").FullName
          )

          if ($channel -eq "beta") {
            # Beta: pre-release; gh creates the tag server-side on this commit
            & gh release create $tag @installers --title "v$version" --generate-notes --prerelease --target ${{ github.sha }}
          } else {
            # Release: full release (verified tag at the trigger SHA was pushed above)
            & gh release create $tag @installers --title "v$version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed' }
        shell: pwsh

      - name: Check Cloudflare R2 publishing credentials
        id: r2
        shell: bash
        run: |
          if [ -n "${{ secrets.R2_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.R2_SECRET_ACCESS_KEY }}" ] && [ -n "${{ secrets.MIB_STUDIO_R2_ENDPOINT }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Publish to Cloudflare R2 ───────────────────────────────
      - name: Publish update package to Cloudflare R2
        if: steps.r2.outputs.available == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MIB_STUDIO_R2_ENDPOINT: ${{ secrets.MIB_STUDIO_R2_ENDPOINT }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $channel = "${{ steps.version.outputs.channel }}"
          $artifactVersion = '${{ steps.version.outputs.artifact_version }}'
          $updateInstaller = Get-Item -LiteralPath "build\dist\MIB_Studio_Qt_Update_v$artifactVersion.exe"
          python publish-update.py `
            --installer $updateInstaller.FullName `
            --version $version `
            --channel $channel `
            --upload-method s3 `
            --release-notes-url "https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
          if ($LASTEXITCODE -ne 0) { throw 'Cloudflare R2 update publish failed' }
        shell: pwsh

      - name: Skip full installer Cloudflare R2 publish
        run: |
          $artifactVersion = '${{ steps.version.outputs.artifact_version }}'
          $setupInstaller = Get-Item -LiteralPath "build\dist\MIB_Studio_Qt_Setup_v$artifactVersion.exe"
          $sizeMb = [math]::Round($setupInstaller.Length / 1MB, 1)
          Write-Host "Full installer: $($setupInstaller.Name) ($sizeMb MiB)"
          Write-Host "Skipping Cloudflare R2 upload for the full installer because large installers are attached to GitHub Release only."
          Write-Host "The full installer remains attached to the GitHub Release; Cloudflare R2 latest.json points to the update package."
        shell: pwsh
