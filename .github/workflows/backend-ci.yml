name: Backend CI

on:
  push:
    branches: [main, master, develop, dev/react-tauri]
  pull_request:
    branches: [main, master, develop, dev/react-tauri]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Linux backend-only build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The linux-backend-only preset uses Unix Makefiles with no job count, so
    # without this every build compiled one file at a time on a 4-CPU runner.
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare log directory
        shell: bash
        run: mkdir -p artifacts/backend-ci

      # Sections base+backend only: no qt6-* packages, which proves the backend
      # is Qt-free (epic #246 Phase 1 exit gate). The list is env/apt-packages.txt.
      - name: Set up Linux build environment
        uses: ./.github/actions/setup-linux-env
        with:
          sections: base,backend
          conan: "true"
          mindvision: "true"
          assets: required

      - name: Probe Conan dependency availability
        shell: bash
        run: |
          set +e
          conan install . \
            --profile:host=conan/profiles/linux-gcc13 \
            --profile:build=default \
            --output-folder=build/linux-backend-conan \
            --build=never \
            -c tools.system.package_manager:mode=report \
            2>&1 | tee artifacts/backend-ci/conan-install.log
          conan_status=${PIPESTATUS[0]}
          set -e
          if [ "$conan_status" -ne 0 ]; then
            echo "::warning::Conan dependency availability probe exited ${conan_status}; backend-only configure/build/test uses Linux system packages. See artifacts/backend-ci/conan-install.log."
          fi

      - name: Configure backend-only preset
        shell: bash
        run: |
          set -o pipefail
          cmake --preset linux-backend-only 2>&1 | tee artifacts/backend-ci/configure.log

      - name: Build backend-only preset
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset linux-backend-only-build 2>&1 | tee artifacts/backend-ci/build.log

      - name: Build mib_processing explicitly
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset linux-backend-only-build --target mib_processing 2>&1 | \
            tee artifacts/backend-ci/build-mib-processing.log

      - name: Verify mib_processing has no Qt dependency
        shell: bash
        # mib_processing (the portable deformability-cytometry core, see
        # docs/gold_standard_metrics.md "Portable Processing Contract") must
        # stay Qt-free so a non-Qt consumer (Biowork's services/mib-processing,
        # tracked in the Biowork portability epic) can build it without a Qt
        # toolchain. Regression guard: fail CI if any Qt symbol leaks in.
        run: |
          set -euo pipefail
          lib="build/linux-backend/libmib_processing.a"
          test -f "$lib"
          if nm "$lib" | grep -Eq '\b(Q[A-Z][A-Za-z0-9_]*(6|)::|_ZN[0-9]+Q[A-Z])'; then
            echo "::error::libmib_processing.a references Qt symbols; it must stay Qt-free."
            nm "$lib" | grep -E '\b(Q[A-Z][A-Za-z0-9_]*(6|)::|_ZN[0-9]+Q[A-Z])'
            exit 1
          fi
          echo "OK: libmib_processing.a has no Qt symbol references."

      - name: Test backend-only preset
        shell: bash
        env:
          # Avoid the network LUT-manifest fetch at AppBackend startup (offline
          # CI) by pointing at a file: URL; absent file -> graceful fallback.
          MIB_STUDIO_EMODULUS_LUT_MANIFEST_URL: "file:///nonexistent/mib-lut-manifest.json"
        run: |
          set -o pipefail
          ctest --preset linux-backend-only-test --output-on-failure 2>&1 | tee artifacts/backend-ci/test.log

      - name: PL replay lane (ADR 0011)
        shell: bash
        # The hardware-free PZ7035 tests carry the `pl` ctest label: record
        # decoder and provider replay, profile compiler, platform monitor, the
        # Contract 3 vectors and host/PL equality, and the vendored ABI check.
        # They already ran above; this step names the lane so it shows up in
        # the PR checks and so an emptied or shrunken selection fails. Two of
        # them (processing.unet_c4, processing.pz_board_run_host) report SKIP
        # here: they need the private model weights or a board run.
        env:
          MIB_STUDIO_EMODULUS_LUT_MANIFEST_URL: "file:///nonexistent/mib-lut-manifest.json"
        run: |
          set -o pipefail
          total=$(ctest --preset linux-backend-only-test -N -L pl | sed -n 's/^Total Tests: //p')
          echo "PL lane: ${total} tests"
          # Lower bound: raise it when a PL test is added.
          if [ "${total:-0}" -lt 15 ]; then
            echo "::error::PL replay lane shrank to ${total:-0} tests (expected >= 15): a pl label or test was dropped."
            exit 1
          fi
          ctest --preset linux-backend-only-test -L pl --no-tests=error --output-on-failure 2>&1 | tee artifacts/backend-ci/pl-lane.log

      - name: Upload backend CI logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-ci-logs-${{ github.run_id }}
          path: |
            artifacts/backend-ci/*.log
            build/linux-backend/Testing/Temporary/LastTest.log
            build/linux-backend/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
