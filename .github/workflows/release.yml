name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.2)'
        required: true

permissions:
  contents: write  # Required for creating GitHub Releases

jobs:
  build-and-release:
    # Pinned to windows-2022: the project's Conan profile and toolchain target
    # msvc 194 / toolset v143 (VS2022) and the CMake preset uses the
    # "Visual Studio 17 2022" generator. windows-latest moved to VS2026, which
    # has no v143 instance, breaking configure. Matches build-windows.yml.
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Validate requested release tag
        id: release-ref
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must be vX.Y.Z or vX.Y.Z-beta.<identifier>; got '$TAG'" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout requested release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.release-ref.outputs.ref }}

      - name: Extract version from checked-out tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release-ref.outputs.tag }}"
          TAG_COMMIT=$(git rev-list -n 1 "$TAG")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "Checked-out commit $HEAD_COMMIT does not match $TAG ($TAG_COMMIT)" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          # Inno Setup uses CMake's numeric PROJECT_VERSION even when the
          # release identity carries a beta suffix.
          ARTIFACT_VERSION="${VERSION%%-*}"
          if [[ "$TAG" == *-beta.* ]]; then
            CHANNEL="beta"
          else
            CHANNEL="stable"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$ARTIFACT_VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Building release: $TAG (version $VERSION)"

      - name: Validate processing-core signer trust pin
        shell: pwsh
        env:
          PROCESSING_CORE_SIGNER_SPKI_SHA256: ${{ vars.MIB_PROCESSING_CORE_SIGNER_SPKI_SHA256 }}
        run: |
          if ($env:PROCESSING_CORE_SIGNER_SPKI_SHA256 -notmatch '^[0-9A-Fa-f]{64}$') {
            throw 'Repository variable MIB_PROCESSING_CORE_SIGNER_SPKI_SHA256 must be a non-empty 64-hex DER-SPKI SHA-256 before a desktop release can build'
          }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Conan
        run: |
          pip install conan boto3 numpy
          conan profile detect --force

          # Create CI profile pinned to msvc 194 to match prebuilt binaries
          @"
          [settings]
          os=Windows
          arch=x86_64
          compiler=msvc
          compiler.version=194
          compiler.cppstd=17
          compiler.runtime=dynamic
          build_type=Release
          "@ | Out-File -FilePath "$env:USERPROFILE\.conan2\profiles\ci" -Encoding UTF8
          Write-Host "CI Conan profile created:"
          conan profile show -pr ci

          # Add team Conan remote as primary
          if ($env:CONAN_REMOTE_URL) {
            conan remote add team-conan $env:CONAN_REMOTE_URL --index 0
            conan remote login team-conan $env:CONAN_REMOTE_USER -p $env:CONAN_REMOTE_PASSWORD
            Write-Host "Team Conan remote configured"
          } else {
            Write-Host "CONAN_REMOTE_URL not set, using ConanCenter only" -ForegroundColor Yellow
          }
        shell: pwsh
        env:
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
          CONAN_REMOTE_USER: ${{ secrets.CONAN_REMOTE_USER }}
          CONAN_REMOTE_PASSWORD: ${{ secrets.CONAN_REMOTE_PASSWORD }}

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt') }}-release
          restore-keys: |
            conan-${{ runner.os }}-${{ hashFiles('conanfile.txt') }}-
            conan-${{ runner.os }}-

      - name: Download eGrabber SDK
        run: |
          $sdkUrl = "https://updates.yofo.bio/egrabber-sdk-installer/egrabber-win-x86_64-25.10.0.57.exe"
          curl.exe --fail --location --retry 3 --output egrabber-sdk.exe $sdkUrl
          $sdkSize = (Get-Item egrabber-sdk.exe).Length
          if ($sdkSize -lt 100MB) {
            Write-Host "ERROR: Downloaded eGrabber SDK is unexpectedly small: $sdkSize bytes" -ForegroundColor Red
            exit 1
          }
          $installer = Start-Process -FilePath .\egrabber-sdk.exe -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            Write-Host "ERROR: eGrabber SDK installer failed with exit code $($installer.ExitCode)" -ForegroundColor Red
            exit $installer.ExitCode
          }
          if (!(Test-Path "C:\Program Files\Euresys\eGrabber\include")) {
            Write-Host "ERROR: eGrabber SDK headers not found" -ForegroundColor Red
            exit 1
          }
          Write-Host "eGrabber SDK installed"
          New-Item -ItemType Directory -Force resources\installers | Out-Null
          Copy-Item egrabber-sdk.exe resources\installers\egrabber-win-x86_64-25.10.0.57.exe
        shell: pwsh

      - name: Download VC++ Redistributable
        run: |
          New-Item -ItemType Directory -Force resources\installers | Out-Null
          curl.exe --fail --location --retry 3 --output resources\installers\vc_redist.x64.exe "https://aka.ms/vs/17/release/vc_redist.x64.exe"
        shell: pwsh

      - name: Provision pinned MindVision SDK
        shell: pwsh
        run: |
          $sdk = .\scripts\provision-mindvision-sdk.ps1 `
            -Destination build\vendor\mindvision-sdk `
            -PassThru
          "MIB_MINDVISION_SDK_ROOT=$($sdk.SdkRoot)" >> $env:GITHUB_ENV
          "MIB_MINDVISION_RUNTIME_DIR=$($sdk.RuntimeDir)" >> $env:GITHUB_ENV

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          conan install . -of build --build=missing -s build_type=Release -pr ci
          if ($LASTEXITCODE -ne 0) {
            Write-Host "WARNING: Conan install failed with current remotes (possibly team-conan). Retrying after disabling team-conan remote." -ForegroundColor Yellow
            conan remote remove team-conan 2>$null
            conan install . -of build --build=missing -s build_type=Release -pr ci
            if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: Conan install failed after removing team-conan remote." -ForegroundColor Red
              exit 1
            }
          }

      - name: Upload packages to team remote
        if: always() && env.CONAN_REMOTE_URL != ''
        continue-on-error: true
        run: conan upload "*" -r team-conan -c
        env:
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}

      - name: Configure CMake
        shell: pwsh
        env:
          MIB_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PROCESSING_CORE_SIGNER_SPKI_SHA256: ${{ vars.MIB_PROCESSING_CORE_SIGNER_SPKI_SHA256 }}
        run: |
          $cmakeArgs = @(
            "--preset",
            "windows-default",
            "-DMIB_ENABLE_MINDVISION=ON",
            "-DMIB_MINDVISION_SDK_ROOT=$env:MIB_MINDVISION_SDK_ROOT",
            "-DMIB_MINDVISION_RUNTIME_DIR=$env:MIB_MINDVISION_RUNTIME_DIR",
            "-DMIB_REQUIRE_PROCESSING_CORE_SIGNER_SPKI=ON",
            "-DMIB_PROCESSING_CORE_SIGNER_SPKI_SHA256=$env:PROCESSING_CORE_SIGNER_SPKI_SHA256",
            "-DMIB_RELEASE_VERSION_OVERRIDE=${{ steps.version.outputs.artifact_version }}",
            "-DMIB_RELEASE_VERSION_FULL_OVERRIDE=${{ steps.version.outputs.version }}"
          )
          if ($env:MIB_SENTRY_DSN) {
            $cmakeArgs += "-DMIB_SENTRY_DSN=$env:MIB_SENTRY_DSN"
            Write-Host "Sentry DSN injected into release build."
          } else {
            Write-Host "SENTRY_DSN not set; released build runs in local-only crash mode (no events sent)." -ForegroundColor Yellow
          }
          cmake @cmakeArgs

      - name: Validate configured release identity
        shell: pwsh
        run: |
          $identity = @{}
          Get-Content -LiteralPath build\mib-release-identity.txt | ForEach-Object {
            $parts = $_ -split '=', 2
            if ($parts.Count -eq 2) { $identity[$parts[0]] = $parts[1] }
          }
          if ($identity.version -ne '${{ steps.version.outputs.artifact_version }}' -or
              $identity.full_version -ne '${{ steps.version.outputs.version }}') {
            throw "Configured release identity diverged: numeric=$($identity.version), full=$($identity.full_version)"
          }

      - name: Build Release
        run: cmake --build build --config Release

      - name: Validate MindVision release payload
        shell: pwsh
        run: |
          $runtime = "build\Release\MVCAMSDK_X64.dll"
          if (-not (Test-Path -LiteralPath $runtime -PathType Leaf)) {
            throw "MindVision runtime is missing from the release payload: $runtime"
          }
          Write-Host "MindVision runtime packaged: $runtime"

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure --timeout 30

      # Without uploaded debug symbols a captured minidump is unsymbolicated
      # (= "not useful"). This was missing from the release path, so shipped
      # releases produced no usable Sentry stacks. Gated on secrets so forks
      # without access skip cleanly.
      - name: Upload debug symbols + create Sentry release
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if (-not $env:SENTRY_AUTH_TOKEN) {
            Write-Host "Skipping Sentry symbol upload: SENTRY_AUTH_TOKEN not set" -ForegroundColor Yellow
            exit 0
          }
          if (-not $env:SENTRY_ORG -or -not $env:SENTRY_PROJECT) {
            Write-Host "ERROR: SENTRY_AUTH_TOKEN is set but SENTRY_ORG / SENTRY_PROJECT are missing." -ForegroundColor Red
            exit 1
          }
          npm install -g @sentry/cli
          sentry-cli --version
          $release = "mib_studio_qt@${{ steps.version.outputs.version }}"
          # Uploads every PDB/EXE under build\Release; --include-sources embeds
          # source paths for readable frames.
          sentry-cli debug-files upload --include-sources build\Release
          sentry-cli releases new $release
          sentry-cli releases set-commits $release --auto --ignore-missing
          sentry-cli releases finalize $release

      - name: Clean installer output directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\dist | Out-Null
          Get-ChildItem -LiteralPath build\dist -Filter 'MIB_Studio_Qt_*' -File `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^MIB_Studio_Qt_(Setup|Update)_v.+\.exe$' } |
            Remove-Item -Force

      - name: Build full installer
        run: cmake --build build --config Release --target package_installer

      - name: Build update package
        run: cmake --build build --config Release --target package_installer_update

      - name: Validate exact installer artifacts and compute checksums
        id: checksums
        shell: pwsh
        run: |
          $artifactVersion = '${{ steps.version.outputs.artifact_version }}'
          $setupPath = Join-Path $PWD "build\dist\MIB_Studio_Qt_Setup_v$artifactVersion.exe"
          $updatePath = Join-Path $PWD "build\dist\MIB_Studio_Qt_Update_v$artifactVersion.exe"
          foreach ($path in @($setupPath, $updatePath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected exact installer artifact was not produced: $path"
            }
          }
          $expected = @($setupPath, $updatePath)
          $unexpected = Get-ChildItem -LiteralPath build\dist -Filter 'MIB_Studio_Qt_*' -File |
            Where-Object {
              $_.Name -match '^MIB_Studio_Qt_(Setup|Update)_v.+\.exe$' -and
              $_.FullName -notin $expected
            }
          if ($unexpected) {
            throw "Unexpected installer artifacts were produced: $($unexpected.Name -join ', ')"
          }
          $setupExe = Get-Item -LiteralPath $setupPath
          $updateExe = Get-Item -LiteralPath $updatePath
          $setupHash = (Get-FileHash -Algorithm SHA256 $setupExe.FullName).Hash.ToLowerInvariant()
          $updateHash = (Get-FileHash -Algorithm SHA256 $updateExe.FullName).Hash.ToLowerInvariant()
          "setup_hash=$setupHash" | Out-File -Append $env:GITHUB_OUTPUT
          "setup_file=$($setupExe.Name)" | Out-File -Append $env:GITHUB_OUTPUT
          "update_hash=$updateHash" | Out-File -Append $env:GITHUB_OUTPUT
          "update_file=$($updateExe.Name)" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "Setup: $($setupExe.Name) SHA256: $setupHash"
          Write-Host "Update: $($updateExe.Name) SHA256: $updateHash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MIB Studio Qt ${{ steps.version.outputs.tag }}
          body: |
            ## MIB Studio Qt ${{ steps.version.outputs.tag }}

            ### Downloads
            - **Full Installer** — For first-time installations (includes eGrabber SDK + VC++ Redistributable)
            - **Update Package** — For existing installations (app files only, smaller download)

            ### Checksums (SHA-256)
            ```
            ${{ steps.checksums.outputs.setup_hash }}  ${{ steps.checksums.outputs.setup_file }}
            ${{ steps.checksums.outputs.update_hash }}  ${{ steps.checksums.outputs.update_file }}
            ```
          files: |
            build/dist/MIB_Studio_Qt_Setup_v${{ steps.version.outputs.artifact_version }}.exe
            build/dist/MIB_Studio_Qt_Update_v${{ steps.version.outputs.artifact_version }}.exe
          draft: false
          prerelease: ${{ steps.version.outputs.channel == 'beta' }}

      - name: Check Cloudflare R2 credentials
        id: r2
        shell: bash
        run: |
          if [ -n "${{ secrets.R2_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.R2_SECRET_ACCESS_KEY }}" ] && [ -n "${{ secrets.MIB_STUDIO_R2_ENDPOINT }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish update package to Cloudflare R2
        if: steps.r2.outputs.available == 'true'
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MIB_STUDIO_R2_ENDPOINT: ${{ secrets.MIB_STUDIO_R2_ENDPOINT }}
        run: |
          $artifactVersion = '${{ steps.version.outputs.artifact_version }}'
          $updateExe = Get-Item -LiteralPath "build\dist\MIB_Studio_Qt_Update_v$artifactVersion.exe"
          python publish-update.py `
            --installer $updateExe.FullName `
            --version "${{ steps.version.outputs.version }}" `
            --channel "${{ steps.version.outputs.channel }}" `
            --upload-method s3 `
            --release-notes-url "https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
