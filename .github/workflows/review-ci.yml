name: YOFO Review CI

# YOFO Review: the review-only React + Tauri product built from the same
# desktop/ tree as MIB Studio (plan docs/exec-plans/active/
# 2026-10-01-standalone-review-app.md, ADR 0008). This Linux lane proves the
# product configuration: the review page builds, the review-only Tauri binary
# (`--features review-only`, `tauri.review.conf.json`) links and boots under
# Xvfb, and the version stamp agrees with cmake/MIBVersion.cmake.
#
# The macOS (PR 5) and Windows (PR 6) lanes build the shipped bundles: the
# review core against static Conan dependencies (conanfile.py
# review_core=True, <os>-review-core preset), the bridge linked from the
# CMake-derived manifest (tools/gen_review_link_manifest.py), then an
# unsigned DMG (ad-hoc signature) / per-user NSIS installer, each checked to
# carry no third-party dylib / DLL and smoke-launched. No signing or
# notarisation (decision log 2026-10-01).

on:
  workflow_dispatch:
  push:
    branches: [develop, "plan/**", "review/**"]
    paths:
      - "desktop/**"
      - "crates/mib-bridge/**"
      - "include/backend/**"
      - "src/backend/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "scripts/gen_bridge_contract.py"
      - "scripts/release/stamp-tauri-version.py"
      - "conanfile.py"
      - "conan/profiles/**"
      - "tools/gen_review_link_manifest.py"
      - "tools/test_gen_review_link_manifest.py"
      - "tools/review_link_probe/**"
      - ".github/workflows/review-ci.yml"
  pull_request:
    branches: [develop]
    paths:
      - "desktop/**"
      - "crates/mib-bridge/**"
      - "include/backend/**"
      - "src/backend/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "scripts/gen_bridge_contract.py"
      - "scripts/release/stamp-tauri-version.py"
      - "conanfile.py"
      - "conan/profiles/**"
      - "tools/gen_review_link_manifest.py"
      - "tools/test_gen_review_link_manifest.py"
      - "tools/review_link_probe/**"
      - ".github/workflows/review-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-linux:
    name: YOFO Review (Linux, headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Version stamping reads the newest v* tag reachable from HEAD.
          fetch-depth: 0

      - name: Set up Linux build environment
        uses: ./.github/actions/setup-linux-env
        with:
          sections: base,backend,desktop-shell
          conan: "false"
          mindvision: "false"
          assets: none

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Version stamp agrees with cmake/MIBVersion.cmake
        shell: bash
        run: python3 scripts/release/stamp-tauri-version.py --check

      - name: Build Qt-free backend archives
        shell: bash
        run: |
          set -o pipefail
          cmake --preset linux-backend-only -DMIB_ENABLE_MINDVISION=OFF
          cmake --build --preset linux-backend-only-build \
            --target mib_backend mib_review_core mib_processing

      - name: Check bridge contract (drift gate, ADR 0004)
        shell: bash
        run: python3 scripts/gen_bridge_contract.py --check

      - name: Review link-manifest generator tests (macOS / Windows link lines)
        shell: bash
        run: python3 tools/test_gen_review_link_manifest.py

      - name: Build both pages (index.html = MIB Studio, review.html = YOFO Review)
        shell: bash
        working-directory: desktop
        run: |
          set -o pipefail
          npm install
          npm run build
          test -f dist/review.html

      - name: Frontend unit tests
        shell: bash
        working-directory: desktop
        run: |
          set -o pipefail
          npm test

      # `tauri build --config tauri.review.conf.json` hands the overlay to
      # tauri-build through TAURI_CONFIG; setting it directly lets plain cargo
      # embed the merged YOFO Review context (window → review.html, product
      # name, identifier) without the bundler, which this Linux lane does not
      # run.
      - name: Build the review-only Tauri binary (YOFO Review context)
        shell: bash
        working-directory: desktop/src-tauri
        env:
          MIB_BRIDGE_NO_CMAKE: "1"
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/hdf5/serial
          MIB_STUDIO_EMODULUS_LUT_MANIFEST_URL: "file:///nonexistent/mib-lut-manifest.json"
        run: |
          set -o pipefail
          TAURI_CONFIG="$(cat tauri.review.conf.json)" cargo build --features review-only
          # The merged context must name the review product, not MIB Studio.
          strings target/debug/mib-studio-desktop | grep -q "bio.yofo.review"
          # ADR 0008: the review product links no AppBackend (cameras, serial,
          # SQLite, Sentry) — only the review bridge over ReviewSession.
          if nm -C target/debug/mib-studio-desktop | grep -q "backend::AppBackend"; then
            echo "review-only binary links AppBackend" >&2; exit 1
          fi
          nm -C target/debug/mib-studio-desktop | grep -q "backend::review::ReviewSession"

      - name: Review bridge tests (review-only feature, no AppBackend)
        shell: bash
        working-directory: crates/mib-bridge
        env:
          MIB_BRIDGE_NO_CMAKE: "1"
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/hdf5/serial
        run: |
          set -o pipefail
          cargo test --no-fail-fast --features review-only

      - name: Smoke-launch YOFO Review under Xvfb
        shell: bash
        run: |
          set -o pipefail
          ./desktop/scripts/xvfb-smoke.sh \
            desktop/src-tauri/target/debug/mib-studio-desktop 10

  review-macos:
    name: YOFO Review (macOS arm64, DMG)
    runs-on: macos-14
    timeout-minutes: 150
    env:
      # One deployment target for Conan (profile os.version), CMake, cc and
      # rustc: the bundle's minimumSystemVersion.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      MIB_BRIDGE_NO_CMAKE: "1"
      MIB_BRIDGE_LINK_MANIFEST: ${{ github.workspace }}/build/review-core/mib-bridge-link-manifest.json

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan and Ninja
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install conan ninja
          conan profile detect --force
          conan profile show -pr:h conan/profiles/macos-appleclang-arm64

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-review-macos-arm64-${{ hashFiles('conanfile.py', 'conan/profiles/macos-appleclang-arm64') }}
          restore-keys: |
            conan-review-macos-arm64-

      - name: Conan install (static review-core graph)
        shell: bash
        run: |
          set -euo pipefail
          conan install . -of build/review-core --build=missing \
            -o "&:review_core=True" \
            -pr:h conan/profiles/macos-appleclang-arm64 \
            -pr:b conan/profiles/macos-appleclang-arm64

      - name: Build the review core and link probe
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset macos-review-core
          cmake --build --preset macos-review-core-build

      - name: Probe runs and links no third-party dylib
        shell: bash
        run: |
          set -euo pipefail
          probe=build/review-core/mib_review_link_probe
          "$probe"
          otool -L "$probe"
          if otool -L "$probe" | tail -n +2 | grep -vE '^[[:space:]]+(/usr/lib/|/System/)'; then
            echo "probe links a non-system dylib (expected static Conan deps)" >&2; exit 1
          fi

      - name: Generate the bridge link manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_gen_review_link_manifest.py
          python3 tools/gen_review_link_manifest.py --build-dir build/review-core
          cat build/review-core/mib-bridge-link-manifest.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/mib-bridge -> target
            desktop/src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Review bridge tests (review-only, manifest link)
        shell: bash
        working-directory: crates/mib-bridge
        run: cargo test --no-fail-fast --features review-only

      - name: Build YOFO Review.app and DMG (unsigned, ad-hoc signature)
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          npm install
          npm run tauri:review -- build --ci --features review-only --bundles app,dmg

      - name: Verify the bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=desktop/src-tauri/target/release/bundle
          app="$bundle/macos/YOFO Review.app"
          test -d "$app"
          plist="$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = bio.yofo.review
          test "$(plutil -extract LSMinimumSystemVersion raw "$plist")" = 13.0
          bin="$app/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$plist")"
          otool -L "$bin"
          if otool -L "$bin" | tail -n +2 | grep -vE '^[[:space:]]+(/usr/lib/|/System/)'; then
            echo "app binary links a non-system dylib" >&2; exit 1
          fi
          codesign -dv "$app" 2>&1 | tee /dev/stderr | grep -q "Signature=adhoc"
          dmg=$(ls "$bundle"/dmg/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          test -d "$mnt/YOFO Review.app"
          hdiutil detach "$mnt"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
          echo "APP_BIN=$bin" >> "$GITHUB_ENV"

      - name: Smoke-launch YOFO Review
        shell: bash
        run: |
          set -euo pipefail
          "$APP_BIN" > smoke.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            cat smoke.log; echo "YOFO Review exited during startup" >&2; exit 1
          fi
          kill "$pid"
          cat smoke.log

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: yofo-review-macos-arm64
          path: ${{ env.DMG }}
          if-no-files-found: error
          retention-days: 14

  review-windows:
    name: YOFO Review (Windows x64, NSIS)
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      MIB_BRIDGE_NO_CMAKE: "1"
      MIB_BRIDGE_LINK_MANIFEST: ${{ github.workspace }}\build\review-core\mib-bridge-link-manifest.json

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # MSVC (cl, link, dumpbin) on PATH for Conan, CMake/Ninja and cargo.
      - name: VS 2022 x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Conan and Ninja
        shell: pwsh
        run: |
          python -m pip install conan ninja
          conan profile detect --force
          conan profile show -pr:h conan/profiles/windows-msvc194-ninja

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-review-windows-x64-${{ hashFiles('conanfile.py', 'conan/profiles/windows-msvc194*') }}
          restore-keys: |
            conan-review-windows-x64-

      - name: Conan install (static review-core graph)
        shell: pwsh
        run: |
          conan install . -of build/review-core --build=missing `
            -o "&:review_core=True" `
            -pr:h conan/profiles/windows-msvc194-ninja `
            -pr:b conan/profiles/windows-msvc194-ninja
          if ($LASTEXITCODE -ne 0) { throw "conan install failed" }

      - name: Build the review core and link probe
        shell: pwsh
        run: |
          cmake --preset windows-review-core
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build --preset windows-review-core-build
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Probe runs and loads no third-party DLL
        shell: pwsh
        run: |
          $probe = "build/review-core/mib_review_link_probe.exe"
          & $probe
          if ($LASTEXITCODE -ne 0) { throw "probe failed ($LASTEXITCODE)" }
          $deps = dumpbin /nologo /dependents $probe | Out-String
          Write-Host $deps
          if ($deps -match '(?im)^\s+(opencv|hdf5|spdlog|fmt|zlib|libpng|jpeg|tiff)\S*\.dll') {
            throw "probe depends on a third-party DLL (expected static Conan deps)"
          }

      - name: Generate the bridge link manifest
        shell: pwsh
        run: |
          python tools/test_gen_review_link_manifest.py
          if ($LASTEXITCODE -ne 0) { throw "generator tests failed" }
          python tools/gen_review_link_manifest.py --build-dir build/review-core
          if ($LASTEXITCODE -ne 0) { throw "manifest generation failed" }
          Get-Content build/review-core/mib-bridge-link-manifest.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/mib-bridge -> target
            desktop/src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Review bridge tests (review-only, manifest link)
        shell: pwsh
        working-directory: crates/mib-bridge
        run: |
          cargo test --no-fail-fast --features review-only
          if ($LASTEXITCODE -ne 0) { throw "bridge tests failed" }

      - name: Build the YOFO Review NSIS installer (unsigned, per-user)
        shell: pwsh
        working-directory: desktop
        run: |
          npm install
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          npm run tauri:review -- build --ci --features review-only --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }

      - name: Verify, install silently and smoke-launch
        shell: pwsh
        run: |
          $bundle = "desktop/src-tauri/target/release/bundle/nsis"
          $setup = Get-ChildItem $bundle -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer in $bundle" }
          Write-Host "installer: $($setup.FullName)"
          "SETUP=$($setup.FullName)" >> $env:GITHUB_ENV
          $proc = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "installer exit code $($proc.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\YOFO Review" -Filter *.exe -Recurse |
            Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw "installed executable not found under $env:LOCALAPPDATA\YOFO Review" }
          Write-Host "installed: $($exe.FullName)"
          $deps = dumpbin /nologo /dependents $exe.FullName | Out-String
          Write-Host $deps
          if ($deps -match '(?im)^\s+(opencv|hdf5|spdlog|fmt|zlib|libpng|jpeg|tiff)\S*\.dll') {
            throw "installed app depends on a third-party DLL"
          }
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "YOFO Review exited during startup (code $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: yofo-review-windows-x64
          path: ${{ env.SETUP }}
          if-no-files-found: error
          retention-days: 14
