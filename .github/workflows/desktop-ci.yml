name: Desktop CI

# Phase 3 of epic #246: the React + Tauri v2 desktop shell (desktop/), which
# drives the Qt-free C++ backend through the mib-bridge (ADR 0003). Builds the
# frontend + the Tauri app, runs the headless bridge round-trip test, and
# smoke-launches the real GUI under Xvfb.

on:
  push:
    branches: [dev/react-tauri, develop, "agent-b/**"]
    paths:
      - "desktop/**"
      - "crates/mib-bridge/**"
      - "include/backend/**"
      - "src/backend/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "scripts/gen_bridge_contract.py"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches: [dev/react-tauri, develop, "agent-b/**"]
    paths:
      - "desktop/**"
      - "crates/mib-bridge/**"
      - "include/backend/**"
      - "src/backend/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "scripts/gen_bridge_contract.py"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: React + Tauri desktop (headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Linux build environment
        uses: ./.github/actions/setup-linux-env
        with:
          sections: base,backend,desktop-shell
          conan: "false"
          mindvision: "false"
          assets: none

      - name: Verify smoke process cleanup
        run: |
          python3 desktop/scripts/test_xvfb_smoke.py
          python3 tools/test_review_isoelastic_embedding.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Qt-free backend archives
        shell: bash
        run: |
          set -o pipefail
          # Headless lane, no camera SDK: develop enables MindVision by
          # default, so opt out explicitly (SDK-free build, MIB_HAS_MINDVISION=0).
          cmake --preset linux-backend-only -DMIB_ENABLE_MINDVISION=OFF
          cmake --build --preset linux-backend-only-build \
            --target mib_backend mib_processing

      - name: Check bridge contract (drift gate, ADR 0004)
        shell: bash
        run: python3 scripts/gen_bridge_contract.py --check

      - name: Build frontend
        shell: bash
        working-directory: desktop
        run: |
          set -o pipefail
          npm install
          npm run build

      - name: Unit-test workflow and frame transaction contracts
        shell: bash
        working-directory: desktop
        run: |
          set -o pipefail
          npm test

      - name: Build Tauri app + run headless bridge test
        shell: bash
        working-directory: desktop/src-tauri
        env:
          MIB_BRIDGE_NO_CMAKE: "1"
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/hdf5/serial
          MIB_STUDIO_EMODULUS_LUT_MANIFEST_URL: "file:///nonexistent/mib-lut-manifest.json"
        run: |
          set -o pipefail
          cargo build --features custom-protocol
          cargo test --no-fail-fast

      - name: Smoke-launch the GUI under Xvfb
        shell: bash
        run: |
          set -o pipefail
          ./desktop/scripts/xvfb-smoke.sh \
            desktop/src-tauri/target/debug/mib-studio-desktop 10

      - name: Install native WebDriver adapter
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Native production webview experiment-to-export acceptance
        env:
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/hdf5/serial
        run: |
          xvfb-run -a python3 desktop/scripts/native-workflow.py \
            desktop/src-tauri/target/debug/mib-studio-desktop \
            --artifacts build/native-workflow-ci

      - name: Package Linux candidate with resolved native dependencies
        run: python3 desktop/scripts/bundle-deb.py --debug

      - name: Verify extracted Linux package workflow
        env:
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/hdf5/serial
        run: |
          package=$(find desktop/src-tauri/target/debug/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          dpkg-deb --extract "$package" build/package-root
          xvfb-run -a python3 desktop/scripts/native-workflow.py \
            build/package-root/usr/bin/mib-studio-desktop \
            --artifacts build/native-package-workflow-ci

      - name: Preserve Linux development package
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-development-deb
          path: desktop/src-tauri/target/debug/bundle/deb/*.deb
          retention-days: 7

      - name: Preserve native workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-webview-workflow
          path: |
            build/native-workflow-ci
            build/native-package-workflow-ci
          if-no-files-found: ignore
