name: Desktop CI

# Phase 3 of epic #246: the React + Tauri v2 desktop shell (desktop/), which
# drives the Qt-free C++ backend through the mib-bridge (ADR 0003). Builds the
# frontend + the Tauri app, runs the headless bridge round-trip test, and
# smoke-launches the real GUI under Xvfb.

on:
  push:
    branches: [dev/react-tauri, develop, "agent-b/**"]
    paths:
      - "desktop/**"
      - "crates/mib-bridge/**"
      - "include/backend/**"
      - "src/backend/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "scripts/gen_bridge_contract.py"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches: [dev/react-tauri, develop, "agent-b/**"]
    paths:
      - "desktop/**"
      - "crates/mib-bridge/**"
      - "include/backend/**"
      - "src/backend/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "scripts/gen_bridge_contract.py"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: React + Tauri desktop (headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux system packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            libgl1-mesa-dev \
            libhdf5-dev \
            libopencv-dev \
            libspdlog-dev \
            libsqlite3-dev \
            libxkbcommon-dev \
            nlohmann-json3-dev \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            xvfb

      - name: Provision pinned MindVision SDK
        shell: bash
        run: ./scripts/provision-mindvision-sdk.sh --github-env "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Qt-free backend archives
        shell: bash
        run: |
          set -o pipefail
          cmake --preset linux-backend-only
          cmake --build --preset linux-backend-only-build \
            --target mib_backend mib_processing

      - name: Check bridge contract (drift gate, ADR 0004)
        shell: bash
        run: python3 scripts/gen_bridge_contract.py --check

      - name: Build frontend
        shell: bash
        working-directory: desktop
        run: |
          set -o pipefail
          npm install
          npm run build

      - name: Unit-test workflow and frame transaction contracts
        shell: bash
        working-directory: desktop
        run: |
          set -o pipefail
          npm test

      - name: Build Tauri app + run headless bridge test
        shell: bash
        working-directory: desktop/src-tauri
        env:
          MIB_BRIDGE_NO_CMAKE: "1"
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/hdf5/serial
          MIB_STUDIO_EMODULUS_LUT_MANIFEST_URL: "file:///nonexistent/mib-lut-manifest.json"
        run: |
          set -o pipefail
          cargo build
          cargo test --no-fail-fast

      - name: Smoke-launch the GUI under Xvfb
        shell: bash
        run: |
          set -o pipefail
          ./desktop/scripts/xvfb-smoke.sh \
            desktop/src-tauri/target/debug/mib-studio-desktop 10
