name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Pinned to windows-2022 to match the project's VS2022 / msvc-194 toolchain
    # (windows-latest moved to VS2026). Matches release.yml and build-windows.yml.
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate CMake configuration
        shell: pwsh
        run: |
          # Check version is set
          $versionFile = "cmake/MIBVersion.cmake"
          $content = Get-Content $versionFile -Raw
          if ($content -match 'set\(DEFAULT_VERSION\s+"(\d+\.\d+\.\d+)"\)') {
            Write-Host "Version: $($matches[1])" -ForegroundColor Green
          } else {
            Write-Host "ERROR: DEFAULT_VERSION not found in $versionFile" -ForegroundColor Red
            exit 1
          }

      - name: Validate InnoSetup scripts
        shell: pwsh
        run: |
          # Ensure installer scripts exist and reference the correct build dir
          $scripts = @(
            "resources/installers/mib-studio-qt.iss",
            "resources/installers/mib-studio-qt-update.iss"
          )
          foreach ($script in $scripts) {
            if (Test-Path $script) {
              Write-Host "OK: $script" -ForegroundColor Green
            } else {
              Write-Host "ERROR: Missing $script" -ForegroundColor Red
              exit 1
            }
          }

      - name: Check release script syntax
        shell: pwsh
        run: |
          # Parse scripts without executing to catch syntax errors
          $scripts = @(
            "release.ps1",
            "bump-version.ps1",
            "publish-update.ps1",
            "scripts/provision-mindvision-sdk.ps1"
          )
          foreach ($script in $scripts) {
            if (Test-Path $script) {
              $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $script -Raw), [ref]$null)
              Write-Host "OK: $script" -ForegroundColor Green
            }
          }
