# User-guide website for operators: renders docs/manual/ as-is.
# Built and deployed by .github/workflows/docs-site.yml (GitHub Pages).
# Local preview:  pip install mkdocs-material && mkdocs serve
site_name: MIB Studio Qt — User Guide
site_description: >-
  Intro and operator manual for MIB Studio Qt: connect a camera, acquire
  and record experiments, review results, and troubleshoot — with
  screenshots generated from the released application itself.
site_url: https://kpt1020.github.io/mib-studio-qt/
repo_url: https://github.com/KPT1020/mib-studio-qt
repo_name: KPT1020/mib-studio-qt
edit_uri: edit/main/docs/manual/

docs_dir: docs/manual
site_dir: site

# README.md stays the in-repo index (regeneration instructions for
# developers); index.md is the website landing page. Excluding README
# avoids two pages competing for index.html.
exclude_docs: |
  README.md

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Connect a camera: connect.md
  - Acquire & record: acquire-and-record.md
  - Review & post-process: review-and-postprocess.md
  - YOFO Review: yofo-review.md
  - Troubleshooting: troubleshooting.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true

plugins:
  - search
